/* ====================================================================== deck: the board on a phone / tablet */
body.deck{background:#07080b;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
body.deck #isl{position:fixed;inset:0;width:100%!important;height:100%!important}
body.deck .layer{transition:none;filter:none;transform:none}
.deck{height:100%;display:flex;flex-direction:column;gap:16px;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 22px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 22px)}
.dk-wait{height:100%;display:grid;place-items:center;align-content:center;gap:14px;color:var(--mut);font-size:15px;text-align:center;padding:30px}
.dk-wait b{font-size:22px;color:var(--fg);font-weight:750}
.dk-head{display:flex;align-items:center;gap:14px;flex:none;min-height:56px}
.dk-clock{display:flex;align-items:baseline;gap:5px;flex:none}
.dk-clock b{font-size:62px;font-weight:800;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.dk-clock span{font-size:17px;color:var(--mut);font-weight:650}
.dk-date{display:flex;flex-direction:column;gap:3px;min-width:0;margin-left:8px}
.dk-date b{font-size:19px;font-weight:720;letter-spacing:-.01em;white-space:nowrap}
.dk-date span{font-size:13.5px;color:var(--mut);white-space:nowrap}
.dk-chip{display:flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:22px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);font-weight:720;font-size:15px;white-space:nowrap;flex:none}
.dk-chip .mut{font-weight:600;font-size:13px}
.dk-live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none;transition:background .3s,box-shadow .3s}
.dk-live.off{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:dkblink 1.2s ease-in-out infinite}
@keyframes dkblink{50%{opacity:.25}}
.dk-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.32fr) minmax(0,1fr);gap:16px}
.dk-col{min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dk-col::-webkit-scrollbar{display:none}
.dk-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:26px;padding:12px}
.dk-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;color:var(--mut);padding:4px 6px 12px}
/* music */
.dmusic.dkm{flex:1 0 auto;min-height:340px;padding:24px;gap:14px;border-radius:30px}
.dkm-top{display:flex;align-items:center;gap:16px;position:relative;padding-right:146px}
.dkm-art{width:92px;height:92px;border-radius:20px;background:#1d2130 center/cover;flex:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.dkm-t{font-size:23px!important;font-weight:780;letter-spacing:-.015em;line-height:1.15;white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dkm-a{font-size:15px}
.dkm-like{position:absolute;top:20px;right:20px;z-index:1}
.dkm-like .xb{width:42px;height:42px}
.dmusic.dkm .lyr .la{font-size:30px}
.dkm-seek{position:relative;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.dkm-seek .bar{flex:1;height:6px;position:relative}
.dkm-seek .bar::before{content:"";position:absolute;left:0;right:0;top:-16px;bottom:-16px}
.dkm-ctl{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.dkm-ctl>span{width:58px;height:58px;border-radius:29px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:transform .15s var(--spring),background .2s}
.dkm-ctl>span:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.dkm-ctl>span.pp{width:80px;height:80px;border-radius:40px;background:#fff;box-shadow:0 10px 34px rgba(0,0,0,.4)}
.dkm-ctl>span.pp:active{background:#e5e7ee}
.dmusic.dkm .mnext{position:relative;font-size:12.5px}
/* volume sliders: drag sideways anywhere on the row, tap the icon to mute */
.dsl{position:relative;height:58px;border-radius:19px;background:rgba(255,255,255,.055);overflow:hidden;display:flex;align-items:center;gap:12px;
  padding:0 16px 0 9px;touch-action:pan-y;cursor:ew-resize}
.dsl+.dsl{margin-top:8px}
.dsl-f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--tint,#a78bfa) 40%,transparent),color-mix(in srgb,var(--tint,#a78bfa) 78%,transparent));
  border-right:2px solid color-mix(in srgb,var(--tint,#a78bfa) 85%,#fff);transition:width .14s ease-out}
.dsl.drag .dsl-f{transition:none}
.dsl.drag{background:rgba(255,255,255,.09)}
.dsl-i{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(0,0,0,.28);cursor:pointer;color:#e6e8ef}
.dsl-i img{width:24px;height:24px;border-radius:6px}
.dsl-n{position:relative;flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsl-p{position:relative;font-weight:760;font-variant-numeric:tabular-nums;font-size:14.5px;color:rgba(255,255,255,.88)}
.dsl.master .dsl-n{font-weight:780}
.dsl.muted .dsl-f{opacity:.22}.dsl.muted .dsl-n,.dsl.muted .dsl-p{opacity:.5}
.dsl.muted .dsl-i{color:var(--bad)}
/* buttons */
.dk-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dkt{position:relative;min-height:96px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;
  justify-content:space-between;gap:10px;padding:13px;cursor:pointer;transition:transform .14s var(--spring),background .2s,border-color .2s;overflow:hidden}
.dkt:active{transform:scale(.94);background:rgba(255,255,255,.1)}
.dkt i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-style:normal}
.dkt b{font-size:14.5px;font-weight:730;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkt small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkt.on{background:color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.03));border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.dkt.on i{background:var(--c);color:#0a0b0f}
.dkt.add{border-style:dashed;align-items:center;justify-content:center;color:var(--dim);background:transparent}
.dkt.flash::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:0;animation:dkflash .45s ease-out}
@keyframes dkflash{0%{opacity:.35}100%{opacity:0}}
.deck .lnch{margin:0;gap:10px}
.deck .lnch span{width:60px;height:60px;border-radius:19px}
.deck .lnch img{width:32px;height:32px;border-radius:8px}
.deck .lnch b{font-size:20px}
.dk-cap{font-size:11.5px;color:var(--dim);padding:8px 6px 0;font-weight:600}
.deck .sys{grid-template-columns:1fr 1fr}
.dk-tabs{display:none}
/* tablet standing up: music across the top, controls | today below */
@media (orientation:portrait) and (min-width:700px){
  .dk-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}

    height:66px;border-radius:33px;background:rgba(22,24,32,.82);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid rgba(255,255,255,.09);padding:6px;gap:6px;z-index:5;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .dk-tabs span{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}

}

@media (orientation:landscape) and (max-height:520px){

/* pill icons: small animated marks (no characters). Each key / click = a hit (.sl / .sr on .ic); they move with the music
   (--bob), turn orange-red when the laptop runs hot, glow harder while you type fast, dim when you're away */
.budw.ic{position:relative;width:22px;height:22px;display:inline-grid;place-items:center;margin:0 4px 0 2px;transform:none;
  --c1:#10b981;--c2:#22d3ee;--c3:#a7f3d0;transition:opacity .6s}
body.bud-hot .budw.ic{--c1:#f97316;--c2:#ef4444;--c3:#fde68a}
.budw.ic::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--c1);opacity:0;pointer-events:none}
.budw.ic.sl::before{animation:icr1 .5s ease-out}
.budw.ic.sr::before{animation:icr2 .5s ease-out}
@keyframes icr1{from{opacity:.85;transform:scale(.7)}to{opacity:0;transform:scale(1.65)}}
@keyframes icr2{from{opacity:.85;transform:scale(.7)}to{opacity:0;transform:scale(1.65)}}
@keyframes icspin{to{transform:rotate(360deg)}}
body.away .budw.ic{opacity:.35}
body.away .budw.ic *,body.away .budw.ic::before{animation-play-state:paused!important}
.budw.ic .o{width:15px;height:15px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));
  box-shadow:0 0 9px color-mix(in srgb,var(--c1) 55%,transparent);rotate:var(--rot,0deg);transition:rotate .5s cubic-bezier(.2,.8,.2,1),scale .09s linear,filter .3s,box-shadow .3s;
  scale:calc(1 + var(--bob,0) * .3)}
.budw.ic .hl{position:absolute;width:15px;height:15px;border-radius:50%;pointer-events:none;scale:calc(1 + var(--bob,0) * .3);transition:scale .09s linear;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0 9%,rgba(255,255,255,0) 34%),radial-gradient(circle at 50% 120%,rgba(0,0,0,.35),transparent 60%)}
.budw.ic.sl .o,.budw.ic.sr .o{filter:brightness(1.4) saturate(1.2);transition:none}
body.bud-fire .budw.ic .o{animation:icspin 1.4s linear infinite;box-shadow:0 0 14px var(--c1)}
.budw.ic.bars{grid-auto-flow:column;grid-template-columns:repeat(4,3px);gap:2.2px}
.budw.ic.bars::before,.budw.ic.dots::before{display:none}
.budw.ic.bars i{width:3px;height:16px;border-radius:2px;background:linear-gradient(var(--c2),var(--c1));
  transform:scaleY(calc(.42 + var(--bob,0) * var(--k) * .6));transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
.budw.ic.bars i:nth-child(1){--k:.55;animation-delay:-.2s}.budw.ic.bars i:nth-child(2){--k:.95;animation-delay:-.6s}
.budw.ic.bars i:nth-child(3){--k:.75;animation-delay:-1s}.budw.ic.bars i:nth-child(4){--k:.45;animation-delay:-1.3s}
@keyframes icbar{50%{scale:1 1.45}}
.budw.ic.bars i.on{transform:scaleY(1);transition:none}
body.bud-fire .budw.ic.bars i{animation:icbar .5s ease-in-out infinite}
.budw.ic .r{width:17px;height:17px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,var(--c1) 70%,var(--c3));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.4px),#000 calc(100% - 2.2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.4px),#000 calc(100% - 2.2px));
  rotate:var(--rot,0deg);transition:rotate .5s cubic-bezier(.2,.8,.2,1)}
.budw.ic .c{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c3);box-shadow:0 0 6px var(--c1);
  scale:calc(.85 + var(--bob,0) * .9);transition:scale .09s linear,background .3s}
.budw.ic.ring.sl .c,.budw.ic.ring.sr .c{background:#fff;scale:1.5;transition:none}
body.bud-fire .budw.ic .r{animation:icspin .7s linear infinite}
.budw.ic.dots{grid-template-columns:repeat(3,4px);grid-auto-rows:4px;gap:2.6px}
.budw.ic.dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.24);transition:background .7s,box-shadow .7s;
}
.budw.ic.dots i:nth-child(1){--d:5.3s}.budw.ic.dots i:nth-child(2){--d:7.1s}.budw.ic.dots i:nth-child(3){--d:4.7s}
.budw.ic.dots i:nth-child(4){--d:6.1s}.budw.ic.dots i:nth-child(6){--d:5.9s}
.budw.ic.dots i:nth-child(7){--d:6.7s}.budw.ic.dots i:nth-child(8){--d:4.3s}.budw.ic.dots i:nth-child(9){--d:7.7s}
.budw.ic.dots i:nth-child(5){background:var(--c1);box-shadow:0 0 5px var(--c1);animation:none;scale:calc(1 + var(--bob,0) * .6);transition:scale .09s linear}
@keyframes ictw{0%,88%,100%{background:rgba(255,255,255,.24)}94%{background:color-mix(in srgb,var(--c3) 70%,transparent)}}
.budw.ic.dots i.on{background:var(--c2);box-shadow:0 0 6px var(--c2);transition:none;animation:none}

.dbat i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;min-width:14px}
.dbat i b{display:block;height:100%;border-radius:3px;background:var(--ok)}
.dbat .lo i b{background:var(--bad)}
.dbat .md i b{background:#fbbf24}
.dbat .chg svg{color:#4ade80}

/* r15: shortcuts + clipboard drawers */
body.playing-now .dw-t.on{background:color-mix(in srgb,var(--tint,#fff) 34%,rgba(255,255,255,.06))}
.dap{width:100%;display:flex;flex-direction:column;gap:10px;padding-top:0}
.dap-apps{display:flex;gap:6px;min-height:0}
.dap-a{width:68px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px 4px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s var(--soft)}
.dap-a:hover{background:rgba(255,255,255,.07)}
.dap-a:active{transform:scale(.92)}
.dap-a i{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);font:800 16px/1 var(--mono);color:#fff;font-style:normal}
.dap-a img{width:36px;height:36px;border-radius:8px;pointer-events:none}
.dap-a span{font-size:10.5px;color:#c7c7cc;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dap-q{display:flex;gap:7px;flex-wrap:nowrap;overflow:hidden}
.dap-q span{height:30px;padding:0 11px 0 9px;border-radius:15px;flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);font-size:12px;font-weight:620;
  color:#e5e5ea;cursor:pointer;transition:background .2s,transform .2s var(--soft)}
.dap-q span:hover{background:rgba(255,255,255,.13)}
.dap-q span:active{transform:scale(.94)}
.dap-q span svg{color:var(--qc,#fff)}
.dcl{width:100%;display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.dcl::-webkit-scrollbar{display:none}
.dcl-c{position:relative;flex:0 0 162px;border-radius:15px;background:rgba(255,255,255,.065);padding:11px 12px 9px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  overflow:hidden;transition:background .2s,transform .2s var(--soft)}
.dcl-c:hover{background:rgba(255,255,255,.1)}
.dcl-c:active{transform:scale(.96)}
.dcl-t{flex:1;min-height:0;font-size:12px;line-height:1.38;color:#e5e5ea;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.dcl-c.code .dcl-t{font:11px/1.4 var(--mono)}
.dcl-f{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.45);flex:none}
.dcl-f svg{color:var(--qc,#8e8e93)}
.dcl-c::after{content:"✓ Copied";position:absolute;inset:0;display:grid;place-items:center;background:rgba(74,222,128,.92);color:#04210f;font-weight:800;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.dcl-c.ok::after{opacity:1}
.dbr:hover .dbc .ell{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.dw.side .dw-t{padding:0 7px}
.dw.side .dw-st{display:none}
.dw.side .dap-apps,.dw.side .dap-q{flex-wrap:wrap}

/* drop zone: a file dragged onto the island opens two big targets */
#isl.s-drop.dropping:after{display:none}
.drp{height:100%;display:flex;gap:12px;padding:14px}
.dz{flex:1;border-radius:20px;border:2px dashed rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#8e8e93;transition:border-color .2s,background .2s,color .2s,transform .25s var(--soft)}
.dz b{font-size:14px;font-weight:700;color:#e5e5ea;margin-top:4px}
.dz span{font-size:11px}
.dz.on{border-style:solid;border-color:#60a5fa;background:rgba(96,165,250,.12);color:#93c5fd;transform:scale(1.02)}
.dz[data-drop=phone].on{border-color:#4ade80;background:rgba(74,222,128,.1);color:#86efac}
.dz.on svg{animation:dzb .9s var(--soft) infinite alternate}
@keyframes dzb{to{transform:translateY(-4px)}}
.drp.share{align-items:center;gap:16px;padding:14px 16px 14px 18px}
.drp .qr{width:118px;height:118px;border-radius:14px;background:#fff;padding:6px;flex:none}
.drp .qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
/* stacked notifications: the ones waiting peek out under the island */
#stk{position:absolute;inset:0 0 auto 0;height:0;pointer-events:none;display:none}
body.dock-top #stk{display:block}
#stk i{position:absolute;left:50%;height:26px;border-radius:0 0 18px 18px;opacity:0;transition:opacity .25s ease,transform .45s var(--spring)}
#stk i:nth-child(1){background:#0e0e12;transform:translateY(6px)}
#stk i:nth-child(2){background:#18181e;transform:translateY(0)}
#stk.n1 i:nth-child(2),#stk.n2 i{opacity:1}
#stk.n1 i:nth-child(2),#stk.n2 i:nth-child(2){transform:translateY(8px)}
#stk.n2 i:nth-child(1){transform:translateY(15px)}
.tstk{display:flex;align-items:center;gap:6px;flex:none;font-size:11px;font-weight:700;color:var(--mut)}
.tstk b{font-weight:650;color:#e5e5ea;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:9px;cursor:pointer}
.tstk b:hover{background:rgba(255,255,255,.14)}

/* the cover flies from the pill into the opened island, trailing a glow in its own colour */
.flyart{position:fixed;z-index:60;pointer-events:none;background-image:var(--art);background-size:cover;background-position:center;will-change:left,top,width,height}
.dm-art.landing{opacity:0}
/* island eyes: when nothing plays they look toward the mouse, blink, nap when you're away and smile when you come close */
.eyes{display:inline-flex;gap:5px;align-items:center;height:18px;margin:0 4px;flex:none;transform:translate(var(--ex,0px),var(--ey,0px));
  transition:transform .3s var(--soft)}
.eyes i{width:6.5px;height:11px;border-radius:3.5px;background:#fff;animation:blink 5.4s infinite;transition:height .3s var(--soft),border-radius .3s,width .3s}
.eyes i+i{animation-delay:.04s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.1)}}
body.away .eyes i{animation:none;height:2.2px;border-radius:1.2px;opacity:.75}
#isl.lean .eyes i,.eyes.joy i{animation:none;width:9px;height:5px;background:none;border:2.4px solid #fff;border-bottom:0;border-radius:7px 7px 0 0;margin-top:-3px}
/* timer bubble: a second live thing gets its own little island that splits off the side and merges back */
#bub{position:absolute;top:8px;left:50%;width:46px;height:46px;border-radius:23px;background:var(--bg);display:none;pointer-events:none;opacity:0;
  transform:translateX(-46px) scale(.55);transition:transform .5s var(--soft),opacity .18s ease .3s;box-shadow:0 6px 18px rgba(0,0,0,.28)}
body.dock-top #bub{display:block}
body.notch.dock-top #bub{top:0;border-radius:0 0 23px 23px}
#bub.out{opacity:1;transform:translateX(9px) scale(1);pointer-events:auto;transition:transform .72s var(--spring),opacity .1s ease}
.bub-in{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.bub-r{position:absolute;left:4px;top:4px;width:38px;height:38px;transform:rotate(-90deg)}
.bub-r circle{fill:none;stroke-width:3}
.bub-r .bg{stroke:rgba(245,158,11,.18)}
.bub-r .fg{stroke:#f59e0b;stroke-dasharray:100;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.bub-t{position:relative;font:700 10.5px var(--mono);color:#fbbf24;letter-spacing:-.04em}
.bub-x{color:var(--bad);font-size:14px}
#neck{position:absolute;top:24px;left:50%;width:22px;height:14px;background:var(--bg);border-radius:7px;opacity:0;pointer-events:none;display:none;transform-origin:0 50%}
body.dock-top #neck{display:block}
body.notch.dock-top #neck{top:16px}
#neck.snap{animation:neck .62s var(--soft)}
#neck.join{animation:neck .5s var(--soft) reverse}
@keyframes neck{0%{opacity:1;transform:translateX(-8px) scale(.3,1)}35%{opacity:1;transform:translateX(-5px) scale(1,.8)}
  65%{opacity:1;transform:translateX(-1px) scale(1.05,.28)}100%{opacity:0;transform:translateX(2px) scale(1,0)}}

/* ================================================================== the opened island (hover): icon tabs on top,
   one big thing per tab, straight on black. No cards inside cards. Sizes follow boring.notch (640 x 190). */
body.notch.dock-top:not(.th-berserk):not(.th-qawi){--bg:#000}
#L-peek.layer{filter:none}
.dw{position:relative;height:100%;display:flex;flex-direction:column;padding:0 22px 13px;overflow:hidden}
.dw-bg{position:absolute;inset:-50px;background-size:cover;background-position:center;opacity:0;pointer-events:none;
  filter:blur(34px) saturate(1.5) brightness(.5);transition:opacity .6s ease}
.dw-bg.pb{filter:saturate(1.35) brightness(.48)}
.dw-bg.on{opacity:1}
.dw-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.5))}
.dw-h{position:relative;height:38px;flex:none;display:flex;align-items:center;gap:3px;padding-top:2px}
.dw-t{position:relative;height:28px;padding:0 12px;border-radius:14px;display:grid;place-items:center;color:#8e8e93;cursor:pointer;
  transition:color .2s ease,background .25s ease,transform .2s var(--soft)}
.dw-t:hover{color:#e5e5ea;background:rgba(255,255,255,.07)}
.dw-t:active{transform:scale(.92)}
.dw-t.on{color:#fff;background:rgba(255,255,255,.14)}
.dw-t .nb{position:absolute;top:3px;right:6px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:var(--bad);color:#fff;
  font:800 8.5px/13px var(--mono);text-align:center}
.dw-r{margin-left:auto;display:flex;align-items:center;gap:2px;color:#8e8e93}
.dw-st{display:flex;align-items:center;gap:3px;font:600 11.5px var(--mono);color:#8e8e93;margin-right:6px}
.dw-ic{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:#8e8e93;transition:color .2s,background .2s}
.dw-ic:hover{color:#fff;background:rgba(255,255,255,.09)}
.dw-b{position:relative;flex:1;min-height:0}
.dw-p{position:absolute;inset:0;display:flex}
/* home: the song (big cover) + the plan in a slim column */
.dh{display:flex;gap:18px;width:100%;align-items:center}
.dm{flex:1;min-width:0;display:flex;gap:16px;align-items:center}
.dm-a{position:relative;flex:none;width:94px;height:94px}
.dm-glow{position:absolute;inset:2px;border-radius:18px;background-size:cover;background-position:center;opacity:.6;
  filter:blur(18px) saturate(1.6);transform:scale(1.12);transition:opacity .6s ease}
.dm-art{position:relative;width:94px;height:94px;border-radius:15px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.45);
  background-color:#1c1c22;transition:transform .5s var(--soft),filter .5s ease}
.dm:not(.playing) .dm-art{transform:scale(.88);filter:brightness(.55) saturate(.8)}
.dm:not(.playing) .dm-glow{opacity:.18}
.dm-app{position:absolute;right:-5px;bottom:-5px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  border:2.5px solid var(--bg);font:800 9px/1 var(--mono);color:#fff;font-style:normal}
.dm-c{flex:1;min-width:0;display:flex;flex-direction:column}
.dm-tt{display:flex;align-items:center;gap:6px;min-width:0}
.dm-t{font-size:15.5px;font-weight:720;color:#fff;letter-spacing:-.01em;min-width:0;flex:1}
.dm-tt .xb{color:rgba(255,255,255,.45);cursor:pointer;display:grid;place-items:center;width:24px;height:24px;border-radius:12px}
.dm-ar{font-size:13.5px;font-weight:560;color:color-mix(in srgb,var(--glowc,#1ed760) 55%,#fff);margin-top:1px}
.dm-pr{display:flex;align-items:center;gap:9px;margin-top:10px;font:500 10.5px var(--mono);color:rgba(255,255,255,.55);height:12px}
.dm-pr .bar{flex:1;height:5px;background:rgba(255,255,255,.17);transition:height .15s ease}
.dm-pr .bar.sk:hover,.dm-pr .bar.drag{height:8px}
.dm-pr .bar b{background:#fff}
.dm-ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.dm-ctl span{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .15s var(--spring)}
.dm-ctl span:hover{background:rgba(255,255,255,.1)}
.dm-ctl span:active{transform:scale(.88)}
.dm-ctl span.pp{width:44px;height:44px;border-radius:22px}
.dn{flex:0 0 206px;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-left:18px;
  border-left:1px solid rgba(255,255,255,.08)}
.dn-h{display:flex;flex-direction:column;gap:3px;min-width:0}
.dn-k{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:760;letter-spacing:.08em;text-transform:uppercase;color:#8e8e93}
.dn-k .dn-i{display:grid}
.dn-t{font-size:15px;font-weight:680;color:#fff;letter-spacing:-.01em}
.dn-cd{display:flex;align-items:baseline;gap:6px;color:rgba(255,255,255,.6);font-size:12.5px;font-weight:450}
.dn-cd b{font:620 15px var(--mono);color:#fff;letter-spacing:-.02em}
.dn-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin:5px 0 1px}
.dn-bar b{display:block;height:100%;border-radius:2px;transition:width .8s var(--soft)}
.dn-r{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.dr{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:#e5e5ea}
.dr>i{width:3px;height:14px;border-radius:2px;flex:none}
.dr span{flex:1;min-width:0}
.dr em{font:500 10.5px var(--mono);color:rgba(255,255,255,.5);font-style:normal;flex:none}
.dr.late em,.dr.late span{color:var(--bad)}
.dn.solo{flex:1;flex-direction:row;align-items:center;gap:22px;border:0;padding:0 2px}
.dn.solo .dn-h{flex:1;gap:5px}
.dn.solo .dn-k{font-size:11px}
.dn.solo .dn-t{font-size:21px;font-weight:720}
.dn.solo .dn-cd{font-size:14px}
.dn.solo .dn-cd b{font-size:36px;font-weight:600;letter-spacing:-.03em}
.dn.solo .dn-bar{height:4px;max-width:330px}
.dn.solo .dn-r{flex:0 0 214px;margin:0;align-self:stretch;justify-content:center;padding-left:18px;border-left:1px solid rgba(255,255,255,.08);gap:10px}
/* lyrics: the line being sung, big, over the cover's colours */
.dly{width:100%;display:flex;flex-direction:column;padding-top:2px}
.dly .lyr{flex:1;min-height:0;margin:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.dly .lyr .la{font-size:25px;font-weight:780;letter-spacing:-.015em;line-height:1.16;color:#fff;-webkit-line-clamp:2}
.dly .lyr .lb{font-size:14.5px;font-weight:620;color:rgba(255,255,255,.42)}
.dly .lyr:not(.on)::before{content:"No lyrics for this song";font-size:14px;color:rgba(255,255,255,.5)}
.dly-f{display:flex;align-items:center;gap:10px;font-size:10.5px;color:rgba(255,255,255,.62);height:32px;flex:none}
.dly-f .mp-a,.dly-f .dur{font:500 10.5px var(--mono)}
.dly-art{width:30px;height:30px;border-radius:8px;flex:none;cursor:pointer}
.dly-t{font-size:12px;max-width:190px;color:rgba(255,255,255,.7)}
.dly-t b{color:#fff;font-weight:680}
.dly-f .bar{flex:1;height:4px;background:rgba(255,255,255,.2)}
.dly-f .bar b{background:#fff}
.dly-f>span[data-a]{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s}
.dly-f>span[data-a]:hover{background:rgba(255,255,255,.12)}
/* widgets: four flat tiles */
.dwg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;padding-top:3px}
.tile{position:relative;border-radius:17px;background:rgba(255,255,255,.065);padding:12px 13px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;
  overflow:hidden;transition:background .2s,transform .2s var(--soft)}
.tile[data-a]{cursor:pointer}
.tile[data-a]:hover{background:rgba(255,255,255,.1)}
.tile[data-a]:active{transform:scale(.96)}
.tile .tl{font-size:12px;font-weight:650;color:#fff;margin-top:auto}
.tile .ts{font-size:10.5px;color:rgba(255,255,255,.5);font-weight:500}
.tj-n{font:680 40px/1 var(--mono);letter-spacing:-.04em;color:var(--acc)}
.tj-n .rl{display:inline-flex}
.wt-v{font:700 13px var(--mono);color:#fff}
.wd-k{font:800 9.5px var(--mono);letter-spacing:.08em;color:#fbbf24;background:rgba(251,191,36,.14);padding:2px 6px;border-radius:6px;align-self:flex-start}
.wd-w{font-size:22px;font-weight:720;color:#fff;margin-top:6px}
.tile .wsay{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:13px;display:grid;place-items:center;color:rgba(255,255,255,.6);cursor:pointer}
.tile .wsay:hover{background:rgba(255,255,255,.1);color:#fff}
.wx2-i{font-size:28px;line-height:1}
.wx2-t{font:650 28px/1.1 var(--mono);color:#fff;letter-spacing:-.03em;margin-top:6px}
.ck2-t{font:620 26px/1 var(--mono);color:#fff;letter-spacing:-.03em}
/* notifications */
.dbl{width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:none;padding-bottom:6px;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.dbl::-webkit-scrollbar{display:none}
.dbr{display:flex;align-items:center;gap:11px;padding:6px 6px;border-radius:12px;min-width:0;flex:none}
.dbr:hover{background:rgba(255,255,255,.05)}
.dbi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.dbc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.dbc .ell{font-size:12.5px}
.dbc b{font-weight:650;color:#fff}
.dbc em{font-style:normal;color:rgba(255,255,255,.55)}
.dbc .ds{font-size:10.5px}
.dba{font:500 10.5px var(--mono);color:rgba(255,255,255,.42);flex:none}
.dw-empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:7px;color:#8e8e93;font-size:12.5px;text-align:center}
.dw-empty small{font-size:11px;color:#636366}
/* shelf */
.dws{width:100%;display:flex;flex-direction:column;gap:4px}
.dsh-h{display:flex;align-items:center;gap:8px;font-size:11px;color:#8e8e93;height:18px}
.dsh-h .lk{margin-left:auto;cursor:pointer}
.dsh{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-height:0}
.dsh::-webkit-scrollbar{display:none}
.dsh .shr.dsf{position:relative;flex:0 0 88px;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:14px}
.dsf-i{width:46px;height:46px;display:grid;place-items:center;color:#93c5fd}
.dsh .shr.dsf img{width:44px;height:44px}
.dsf-n{font-size:11px;color:#e5e5ea;text-align:center;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;width:100%}
.dsf-x{position:absolute;top:4px;right:6px;width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;
  font-size:9px;color:#fff;opacity:0;transition:opacity .15s;cursor:pointer}
.dsf:hover .dsf-x{opacity:1}
/* sound */
.dw-ctl{width:100%;overflow-y:auto;scrollbar-width:none;padding:0}
.dw-ctl::-webkit-scrollbar{display:none}
.dw-ctl .vrow.master{border-bottom-color:rgba(255,255,255,.08)}
.vrow.live{padding:0 6px;gap:11px;overflow:visible}     /* the now-playing ".live" style was leaking into mixer rows */
/* docked at the side: the same, stacked */
.dw.side{padding:0 16px 14px}
.dw.side .dw-t{padding:0 9px}
.dw.side .dh{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:14px;padding-top:6px}
.dw.side .dm{flex:none}
.dw.side .dm-a,.dw.side .dm-art{width:76px;height:76px}
.dw.side .dn{flex:none;padding:12px 0 0;border-left:0;border-top:1px solid rgba(255,255,255,.08)}
.dw.side .dn.solo{flex-direction:column;align-items:stretch}
.dw.side .dn.solo .dn-r{flex:none;padding:12px 0 0;border-left:0;border-top:1px solid rgba(255,255,255,.08)}
.dw.side .dwg{grid-template-columns:1fr 1fr;grid-auto-rows:118px}
.dw.side .dly .lyr .la{font-size:21px}
/* ===================================================================== r20 look (last in the sheet, so it wins)
   black first: the album's colour is a glow from the top-left that fades into black; glass tiles; white numbers */

.tile[data-a]:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05) 70%)}

    return `<div class="dkn" style="--c:${c}"><div class="row">${badge(n.cat, 34)}<div class="col" style="flex:1;min-width:0;gap:1px"><span class="k" style="color:${c}">${esc(n.kicker || "")}</span><span class="t ell">${esc(n.title)}</span>${n.body ? `<span class="b ell ${AR.test(n.body) ? "ar" : ""}">${esc(n.body)}</span>` : ""}</div><span class="x" data-a="dk_note_x" data-v="${esc(n.key)}">✕</span></div>
      ${(n.actions || []).length ? `<div class="acts">${n.actions.map((a, i) => `<span data-a="dk_note" data-v="${esc(n.key)}|${i}">${esc(a)}</span>`).join("")}</div>` : ""}</div>`; }).join("");
  if (box.dataset.h !== h) { box.dataset.h = h; box.innerHTML = h; }
}
function deckNoteDrop(key) { S.dkNotes = (S.dkNotes || []).filter(n => n.key !== key); deckNotes(); }

function deckInit() {
  document.title = "Island Deck";
  document.body.className = "dash deck";
  if (DECK_HTTP) {
    const lk = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
    lk("manifest", "/manifest.webmanifest" + location.search);
    lk("apple-touch-icon", "/deck-icon.png");
  }
  try { const t = localStorage.getItem("dkTab"); if (t) S.dkTab = t; } catch (e) {}
  setMode("dash"); renderDeck();
  setInterval(() => { lastDash["dk-head"] = null; if (S.data) renderDeck(); }, 15000);
  setInterval(deckIdleTick, 5000);
  S.dkTouch = Date.now();
  document.addEventListener("pointerdown", e => {                         // idle screens: the first tap only wakes
    S.dkTouch = Date.now();
    if (S.dkAmb) { S.dkAmb = false; const o = $("dk-ov"); if (o) { o.innerHTML = ""; o.dataset.h = ""; } e.preventDefault(); e.stopPropagation(); S.dkSwallow = Date.now(); }
  }, true);
  document.addEventListener("click", e => { if (Date.now() - (S.dkSwallow || 0) < 600) { e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener("input", e => { if (e.target.id === "dksq") { clearTimeout(S.dkSrchD); const v = e.target.value; S.dkSrchD = setTimeout(() => deckSearchGo(v), 450); } });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "dksq") { e.preventDefault(); clearTimeout(S.dkSrchD); deckSearchGo(e.target.value); e.target.blur(); }
    if (e.key === "Enter" && e.target.id === "dkcmd") { e.preventDefault(); const v = e.target.value.trim(); if (v) { send("cmd", v); e.target.value = ""; e.target.blur(); } }
  });
  // swipe the song screen down to close it
  document.addEventListener("pointerdown", e => { if (e.target.closest("#dkfs") && !e.target.closest(".dsl,.bar,[data-a]")) S.dkSw = {y: e.clientY, id: e.pointerId}; });
  document.addEventListener("pointerup", e => { const w = S.dkSw; S.dkSw = null; if (w && e.pointerId === w.id && e.clientY - w.y > 90) deckFullClose(); });
  // sliders: drag sideways (a vertical swipe still scrolls the page)
  document.addEventListener("pointerdown", e => {
    deckAwake();
    const sc = e.target.closest("[data-a='dk_scene']");
    if (sc) { clearTimeout(S.dkHoldT); S.dkHoldT = setTimeout(() => {                      // hold a scene: remove it
      const i = +sc.dataset.v, L = (S.dkScenes || DK_SCENES0).slice(), x = L[i]; if (!x) return; S.dkLong = Date.now();
      if (confirm(`Remove the "${x.n}" scene?`)) { L.splice(i, 1); S.dkScenes = L; renderAll(); send("deck_scenes", L); }
    }, 650); }
    const t = e.target.closest(".dkt[data-a='dk_tile']");
    if (t) { clearTimeout(S.dkHoldT); S.dkHoldT = setTimeout(() => {                       // hold a button: remove it
      const i = +t.dataset.v, T = (S.dkTiles || DK_TILES0).slice(), x = T[i];
      if (!x) return; S.dkLong = Date.now();
      if (confirm(`Remove the "${x.t}" button?`)) { T.splice(i, 1); S.dkTiles = T; renderAll(); send("deck_tiles", T); }
    }, 650); }
    const r = e.target.closest(".dsl"); if (!r || e.target.closest(".dsl-i")) return;
    const o = soundGet(r.dataset.dvol); if (!o) return;
    S.dkDrag = {key: r.dataset.dvol, x0: e.clientX, v0: o.v, w: Math.max(80, r.getBoundingClientRect().width), el: r, id: e.pointerId, moved: false};
  });
  document.addEventListener("pointermove", e => {
    if (S.dkHoldT && S.dkDrag == null) { /* a tiny wobble is still a hold */ }
    const d = S.dkDrag; if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x0;
    if (!d.moved) { if (Math.abs(dx) < 7) return; d.moved = true; d.el.classList.add("drag"); try { d.el.setPointerCapture(e.pointerId); } catch (err) {} }
    deckVol(d.key, Math.max(0, Math.min(1, d.v0 + dx / d.w)));
    if (!S.dkVT) S.dkVT = setTimeout(() => { S.dkVT = null; if (S.dkDrag) sendVol(S.dkDrag.key); }, 90);    // live while you slide
  });
  const up = e => {
    clearTimeout(S.dkHoldT); S.dkHoldT = null;
    const d = S.dkDrag; if (!d || e.pointerId !== d.id) return;
    S.dkDrag = null; d.el.classList.remove("drag");
    if (d.moved) { sendVol(d.key); lastDash["dk-mix"] = null; }
  };
  document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
  document.addEventListener("scroll", () => { clearTimeout(S.dkHoldT); S.dkHoldT = null; }, true);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { S.dkWake = null; deckAwake(); } });
  deckConnect();
}

/* initial */
if (DASH) {
  if (DECK) deckInit();
  else if (DESKW) deskInit();
  else { document.body.className = "dash"; setMode("dash"); setInterval(() => { lastDash.dhead = null; renderDash(); }, 15000); }
  for (const k of ["sys", "sysx", "wx", "spstate", "timers", "lyrics", "media", "data", "settings", "privacy", "prayer"].concat(DECK ? ["sound", "priv", "life", "launch", "timers", "pomo"] : []).concat(DESKW ? ["life", "fit", "cards", "devbat", "screen", "launch", "study", "taps", "adev"] : [])) {   // every update redraws the board
    const f = window.island[k]; if (f) window.island[k] = function (...a) { const r = f.apply(this, a); renderAll(); return r; };
  }
}
else { document.body.className = "dock-top"; setMode("pill"); }
</script>
</body>
</html>
