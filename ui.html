<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Island">
<meta name="theme-color" content="#07080b">
<style>
:root{
  --bg:#0a0b0f; --bg2:#12141c; --card:#161922; --card2:#1d2130; --line:rgba(255,255,255,.08);
  --fg:#f0f2f8; --mut:#8f97ad; --dim:#565e76; --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185; --fire:#ff8a3d;
  --glow:transparent; --acc:#a78bfa;
  --spring:cubic-bezier(.32,1.36,.46,1); --soft:cubic-bezier(.22,1,.36,1);
  --mono:Consolas,ui-monospace,monospace; --tint:#a78bfa;
}
@font-face{font-family:"Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url("fonts/GeistMono-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
body.font-geist{font-family:"Geist","Segoe UI Variable Text","Segoe UI","Noto Sans Arabic",system-ui,sans-serif;--mono:"Geist Mono",Consolas,ui-monospace,monospace;letter-spacing:-.005em}
/* themes */
body.th-berserk{--bg:#060404;--bg2:#100808;--card:#160b0b;--card2:#231111;--line:rgba(255,90,90,.11);--fg:#f4eaea;--mut:#a68f8f;--dim:#6e5757;--acc:#c1121f;--tint:#c1121f}
body.th-berserk .big{background:linear-gradient(100deg,#fff 5%,#ff2a3d 70%,#8a0010 100%);-webkit-background-clip:text}
body.th-qawi{--bg:#040c0b;--bg2:#071715;--card:#0b1a18;--card2:#112724;--line:rgba(94,234,212,.10);--mut:#8aa8a2;--dim:#55716c;--acc:#5eead4;--tint:#5eead4}
/* Album theme: the song's own cover, blurred, behind the whole island (cards turn to glass over it) */
#isl-art{position:absolute;inset:-60px;background-size:cover;background-position:center;pointer-events:none;opacity:0;
  filter:blur(38px) saturate(1.35) brightness(.46);transform:scale(1.08);transition:opacity .9s ease}
#isl-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,10,.3),rgba(6,7,10,.5))}
body.th-album.has-art #isl-art{opacity:1}
body.th-album.has-art #isl:before{opacity:0}
body.th-album.has-art{--acc:color-mix(in srgb,var(--tint) 72%,#fff);--bg:#07080b;--bg2:rgba(8,9,13,.42);--card:rgba(14,15,21,.46);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.09)}
body.th-album.has-art .pill-top,body.th-album.has-art .panel{text-shadow:0 1px 8px rgba(0,0,0,.35)}
body.deck.th-album.has-art #isl-art{inset:-90px;filter:blur(60px) saturate(1.35) brightness(.42)}
body.th-album{--acc:var(--tint);--bg2:color-mix(in srgb,var(--tint) 7%,#0f1117);--card:color-mix(in srgb,var(--tint) 9%,#141720);--card2:color-mix(in srgb,var(--tint) 15%,#1b1f2b);--line:color-mix(in srgb,var(--tint) 14%,rgba(255,255,255,.06))}
/* motion */
body.mo-calm{--spring:cubic-bezier(.22,1,.36,1)}
body.mo-extra{--spring:cubic-bezier(.3,1.75,.5,1)}
#isl.pop{animation:pop .72s var(--soft)}
@keyframes pop{0%{scale:1}28%{scale:1.035}58%{scale:.99}100%{scale:1}}
#isl.bump{animation:bump .62s var(--soft)}
@keyframes bump{0%{translate:0 0}16%{translate:0 5px}36%{translate:0 -3px}58%{translate:0 1.5px}100%{translate:0 0}}
/* edge: accent border, breathing, mouse spotlight */
#halo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;border:1px solid transparent;transition:border-color .9s ease}
body.accent #halo{border-color:color-mix(in srgb,var(--accent,transparent) 42%,transparent)}
body.breathe #isl.s-pill #halo{animation:br 5.5s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
/* nobody at the PC for 10+ min (python sends away): stop the endless decorative animations (each frame repaints the window) */
body.away #halo,body.away .bgart,body.away .eq i,body.away .art.mm{animation-play-state:paused!important}
#halo:after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;opacity:var(--near,0);transition:opacity .25s;
  background:radial-gradient(150px circle at var(--mx,-500px) var(--my,-500px),rgba(255,255,255,.95),color-mix(in srgb,var(--accent,#fff) 55%,transparent) 35%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* rolling digits */
.rl{display:inline-flex;overflow:hidden;vertical-align:bottom;line-height:inherit}
.rl>b{font-weight:inherit;display:inline-block}
.rl>b.in{animation:rl .5s var(--spring)}
@keyframes rl{from{transform:translateY(80%);opacity:0;filter:blur(1px)}to{transform:none;opacity:1;filter:none}}
/* music: real bars, album backdrop, lyrics */
body.viz .eq i{animation:none!important;transition:transform .07s linear}
.mcard .bgart{display:none}
body.artbg .mcard .bgart,body.artbg .live .bgart{display:block;position:absolute;inset:-34px;background-size:cover;background-position:center;opacity:.55;filter:blur(26px) saturate(1.7) brightness(.78);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.15) translate(-3%,-2%)}to{transform:scale(1.3) translate(3%,2%)}}
.live{position:relative;overflow:hidden}
.live>*{position:relative}
.lyr{display:none;flex-direction:column;gap:1px;margin-top:8px;min-height:32px}
.lyr.on{display:flex}
.lyr .la{font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .la.in{animation:ly .45s var(--soft)}
.lyr .lb{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ly{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.lyr-p.on{color:var(--fg)!important;font-weight:650}
/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;grid-auto-columns:15px;gap:4px;justify-content:center;background:var(--card);border-radius:16px;padding:13px}
.heat i{border-radius:4px}
.heatd{display:grid;grid-template-rows:repeat(7,15px);gap:4px;font-size:9.5px;color:var(--dim);font-weight:700;margin-right:4px;align-items:center}
/* glass (experimental) */
body.glass{--bg:rgba(12,13,18,.52);--bg2:rgba(20,22,30,.5);--card:rgba(32,36,48,.5);--card2:rgba(44,49,64,.55)}
body.glass #isl{box-shadow:none;backdrop-filter:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.ring .g svg{transform:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;width:100%;height:100%;
  font-family:"Segoe UI Variable Text","Segoe UI",Inter,"Noto Sans","Noto Sans Arabic",system-ui,sans-serif;
  color:var(--fg);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
svg{display:block}
.ar{direction:rtl;unicode-bidi:plaintext;text-align:right}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------------------------------------------ the island */
#isl{position:absolute;background:var(--bg);overflow:hidden;
  border:1px solid rgba(255,255,255,.075);
  box-shadow:0 22px 60px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.35),0 0 0 0 var(--glow),0 0 34px -6px var(--glow);
  width:var(--w);height:var(--h);border-radius:var(--r);
  transition:box-shadow .8s ease,transform .5s var(--spring),opacity .35s ease,top .5s var(--soft),left .5s var(--soft),right .5s var(--soft)}
/* the shape's size + corners move on a real spring (morph() in JS); the content inside is laid out at its final size
   right away and revealed by the shape, so nothing reflows while it grows */
#isl:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--glow) 22%,transparent),transparent 55%);opacity:.9;transition:background .8s}
.dock-top #isl{top:8px;left:50%;transform:translateX(-50%)}
/* Notch shape: the island grows out of the top edge of the screen, with concave "ears" where it meets it */
body.notch.dock-top #isl{top:0;border-color:transparent;box-shadow:0 6px 18px rgba(0,0,0,.22)}
body.notch.dock-top #isl:before{opacity:0}
body.notch.dock-top #isl .rim,body.notch.dock-top #halo:after{padding-top:0}   /* no light along the screen edge */
body.notch.dock-top #halo{border-top-color:transparent!important}
.ear{position:absolute;top:0;width:var(--ew,12px);height:var(--ew,12px);pointer-events:none;display:none;transition:opacity .3s}
body.notch.dock-top .ear{display:block}
body.notch.dock-top.dashm .ear,#isl.gone~.ear{opacity:0}
#earL{background:radial-gradient(circle at 0 100%,transparent calc(var(--ew,12px) - .7px),var(--bg) var(--ew,12px))}
#earR{background:radial-gradient(circle at 100% 100%,transparent calc(var(--ew,12px) - .7px),var(--bg) var(--ew,12px))}
/* music rim: a slow light that runs around the edge in the cover's colour while a song plays */
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
#isl .rim{position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:4;opacity:0;transition:opacity .7s ease;
  background:conic-gradient(from var(--ga),transparent 0deg,var(--tint,#1ed760) 55deg,transparent 120deg,transparent 180deg,var(--tint,#1ed760) 235deg,transparent 300deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:rim 6s linear infinite;animation-play-state:paused}
body.rimon.playing-now:not(.away) #isl.s-pill:not(.tucked) .rim{opacity:.9;animation-play-state:running}
@keyframes rim{to{--ga:360deg}}
/* backdrops use a pre-blurred copy of the cover: no live blur filter to redraw every frame */
.bgart.pb{filter:brightness(.66)!important}
.dock-left #isl{left:8px;top:50%;transform:translateY(-50%)}
.dock-right #isl{right:8px;top:50%;transform:translateY(-50%)}
#isl.dragging{transition:none;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.12)}
#isl.gone{opacity:0;pointer-events:none}
.layer{position:absolute;top:0;left:50%;width:var(--lw,100%);height:var(--lh,100%);margin-left:calc(var(--lw,100%) / -2);
  opacity:0;transform:translateY(-6px) scale(.96);transform-origin:50% 0;filter:blur(5px);pointer-events:none;
  transition:opacity .16s ease,transform .36s var(--soft),filter .18s ease}
#L-panel.layer,#L-music.layer,#L-dash.layer{filter:none}
.dock-left .layer{left:0;margin-left:0;top:50%;margin-top:calc(var(--lh,100%) / -2);transform:translateX(-7px) scale(.94);transform-origin:0 50%}
.dock-right .layer{left:auto;right:0;margin-left:0;top:50%;margin-top:calc(var(--lh,100%) / -2);transform:translateX(7px) scale(.94);transform-origin:100% 50%}
.layer.on{opacity:1;transform:none;filter:none;pointer-events:auto;transition-delay:.04s}

/* ------------------------------------------------------------------ atoms */
.row{display:flex;align-items:center;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;min-width:0}
.sp{flex:1}
.k{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.t{font-weight:650}
.mut{color:var(--mut)} .dim{color:var(--dim)}
.sep{width:1px;align-self:stretch;margin:12px 2px;background:var(--line)}
.bd{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.chip{font-size:11px;font-weight:750;padding:3px 9px;border-radius:10px;white-space:nowrap}
.bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>b{display:block;height:100%;border-radius:3px;transition:width .6s var(--soft)}
.eq{display:flex;gap:2px;align-items:flex-end;height:13px;flex:none}
.eq i{width:3px;border-radius:2px;background:var(--glowc,#1ed760);height:13px;transform:scaleY(.3);transform-origin:50% 100%;will-change:transform}
.playing .eq i{animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.18s}.eq i:nth-child(3){animation-delay:.36s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{transform:scaleY(.23)}50%{transform:scaleY(1)}}   /* GPU only: no layout per frame */
.art{border-radius:9px;background:conic-gradient(from 210deg,#ff5f6d,#ffc371,#7f5af0,#2cb67d,#ff5f6d);background-size:cover;background-position:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .g{position:absolute;inset:0;display:grid;place-items:center;font-weight:800}
.ico{display:inline-flex;align-items:center;gap:4px;font-weight:750;font-size:12.5px;white-space:nowrap}
.btn{font-size:13px;font-weight:700;padding:7px 15px;border-radius:15px;background:var(--card2);color:var(--fg);cursor:pointer;
  transition:transform .15s var(--spring),background .2s;white-space:nowrap}
.btn:hover{transform:scale(1.05);background:#262b3d}
.btn.pri{background:var(--c,#a78bfa);color:#0a0b0f}
.btn.pri:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.96);transition-duration:.06s}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* ------------------------------------------------------------------ pill (top) */
.pill-top{display:flex;align-items:center;gap:11px;padding:0 9px 0 9px;font-size:13px}
.pill-top .main{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
.pill-top .main .k{flex:none}
.pill-top .mini-media:not(.wide){flex:0 4 auto;min-width:46px}
.pill-top .mini-media .art,.pill-top .mini-media .eq{flex:none}
.pill-top .dlc{flex:0 2 auto;min-width:52px;overflow:hidden}
.pill-top .dlc .dlt{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-top .dlc b{flex:none}
.pill-top.tight{gap:8px}
.pill-top.tight .sep{margin:12px 0}
.pill-top.tight .ico{gap:3px}
.pill-top.tight .ico + .ico{margin-left:-3px}
.pill-top.tight .cd{padding-right:4px}
.pill-top .main .t{flex:0 1 auto;min-width:0}
.pill-top .desc{color:var(--mut);min-width:0;flex:1}
.pill-top .cd{font-weight:750;font-size:13px;padding-right:8px;white-space:nowrap}
.pill-top .clock{font-weight:700;font-variant-numeric:tabular-nums;color:#d8dbe6}
.mini-media{display:flex;align-items:center;gap:7px;max-width:150px;min-width:0}
.prog-line{position:absolute;left:24px;right:24px;bottom:3px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.prog-line b{display:block;height:100%;background:var(--c);transition:width 1s linear}

/* ------------------------------------------------------------------ pill (side) */
.pill-side{display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 0;font-size:12px}
.pill-side .cd{font-weight:800;font-size:13px;line-height:1}
.pill-side .lbl{font-size:10px;color:var(--mut);font-weight:650;margin-top:-5px}
.pill-side .hr{width:60%;height:1px;background:var(--line)}
.pill-side .clock{font-weight:800;font-size:11.5px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.edge-water{position:absolute;top:20px;bottom:20px;width:2px;border-radius:2px;background:var(--line);overflow:hidden}
.dock-left .edge-water{right:4px}.dock-right .edge-water{left:4px}
.edge-water b{position:absolute;bottom:0;left:0;right:0;background:#22d3ee;border-radius:2px;transition:height .6s}

/* ------------------------------------------------------------------ peek */
.peek{display:grid;gap:12px;padding:14px}
.dock-top .peek{grid-template-columns:1.05fr 1fr}
.dock-left .peek,.dock-right .peek{grid-template-columns:1fr}
.card{background:var(--card);border-radius:20px;padding:13px;position:relative;overflow:hidden;min-width:0}
.mcard{background:var(--card)}
.mcard .bgart{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.4);opacity:.35;transition:background-image .6s}
.mcard>*{position:relative}
.ctl{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:9px}
.ctl span{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;cursor:pointer;transition:transform .15s var(--spring),background .2s}
.ctl span:hover{background:rgba(255,255,255,.08);transform:scale(1.12)}
.ctl span:active{transform:scale(.92);transition-duration:.06s}
.ctl span.pp{width:36px;height:36px;background:rgba(255,255,255,.92)}
.ctl span.pp svg path{fill:#0a0b0f}
.ctl span.xb{width:26px;height:26px;color:rgba(255,255,255,.42)}
.ctl span.xb.on,.xb.xh.on{color:color-mix(in srgb,var(--glowc,#1ed760) 50%,#fff);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--glowc,#1ed760) 70%,transparent))}
.ctl span.xb.on{position:relative}
.ctl span.xb.on:after{content:"";position:absolute;bottom:0;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:2px;background:currentColor}
.xb.xh{width:30px;height:30px;display:grid;place-items:center;border-radius:15px;cursor:pointer;color:rgba(255,255,255,.55);flex:none;transition:transform .15s var(--spring),color .2s}
.xb.xh:hover{transform:scale(1.12);color:#fff}
.xb.pop{animation:xpop .35s var(--spring)}
@keyframes xpop{40%{transform:scale(1.35)}}
.mnext{font-size:11.5px;color:var(--mut);text-align:center;margin-top:10px;opacity:.85}
.mnext b{font-weight:650;color:rgba(255,255,255,.82)}
.srcc{display:inline-flex;align-items:center;gap:3px;padding:0 5px;border-radius:7px;background:rgba(255,255,255,.07);cursor:pointer;transition:background .2s}
.srcc:hover{background:rgba(255,255,255,.16);color:#fff}
.stats3{display:flex;gap:14px;align-items:center;font-size:12px}

/* ------------------------------------------------------------------ panel */
.panel{display:flex;flex-direction:column;height:100%}
.ph{padding:16px 18px 10px;display:flex;flex-direction:column;gap:11px;position:relative;cursor:grab}
.ph [data-a],.ph .tabs{cursor:pointer}
.ph::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .2s}
.ph:hover::before{background:rgba(255,255,255,.3)}
#isl.dragging .ph{cursor:grabbing}
.nav{display:flex;gap:2px}
.nav span{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;cursor:pointer;color:var(--mut);transition:background .2s,color .2s}
.nav span:hover{background:var(--card2);color:var(--fg)}
.big{font-size:44px;font-weight:850;line-height:.95;letter-spacing:-1px;
  background:linear-gradient(100deg,#fff 10%,var(--acc) 90%);-webkit-background-clip:text;color:transparent}
.tabs{display:flex;background:var(--bg2);border-radius:16px;padding:3px;gap:3px;position:relative}
.tabs div{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:7px 0;border-radius:13px;color:var(--mut);cursor:pointer;position:relative;z-index:1;transition:color .25s}
.tabs div.on{color:#fff}
.tabs .slider{position:absolute;top:3px;bottom:3px;border-radius:13px;background:var(--card2);transition:left .4s var(--spring),width .4s var(--spring);z-index:0}
.pb{flex:1;overflow-y:auto;padding:4px 14px 16px;scroll-behavior:smooth}
.pb::-webkit-scrollbar{width:6px}.pb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.pane{display:none;flex-direction:column;gap:7px}
.pane.on{display:flex;animation:in .38s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;padding:8px 4px 2px;display:flex}
.sec span+span{margin-left:auto;color:var(--mut);letter-spacing:0;text-transform:none;font-weight:650}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:15px;padding:9px 11px;transition:background .2s,transform .25s var(--spring);position:relative}
.it.tk{cursor:pointer}
.it.tk:hover{background:var(--card2);transform:translateX(3px)}
.it.blk{background:transparent;padding:5px 11px}
.it.blk .t{font-size:12.5px;color:#c4c8d6}
.it.now{background:color-mix(in srgb,var(--c) 10%,var(--card));box-shadow:inset 0 0 0 1.3px color-mix(in srgb,var(--c) 55%,transparent)}
.it.done .t,.it.done .ar,.it.done .ds{opacity:.45}
.tm{font-size:12px;font-weight:700;width:54px;flex:none;font-variant-numeric:tabular-nums}
.tm small{display:block;font-size:10px;color:var(--dim);font-weight:600}
.vline{width:3px;align-self:stretch;border-radius:2px;flex:none}
.ds{font-size:11.5px;color:var(--mut)}
.it .ar{font-size:12.5px;color:#b9bdd0;margin-top:2px}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid #3a3f52;flex:none;display:grid;place-items:center;transition:all .3s var(--spring)}
.ck.on{background:var(--c);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent);transform:scale(1.05)}
.ck.on:after{content:"";width:9px;height:5px;border-left:2.2px solid #0a0b0f;border-bottom:2.2px solid #0a0b0f;transform:translateY(-1px) rotate(-45deg)}
.wcard{background:var(--card);border-radius:18px;padding:13px}
.wchips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.wchips div{text-align:center;font-size:12px;font-weight:750;padding:7px 0;border-radius:13px;background:var(--bg2);color:#22d3ee;cursor:pointer;transition:transform .15s var(--spring),background .2s}
.wchips div:hover{background:var(--card2);transform:translateY(-2px)}
.wchips div:first-child{color:var(--mut)}
.wchips div:active{transform:scale(.95)}
.wchips div.off{opacity:.35;pointer-events:none}
.subj{background:var(--card);border-radius:18px;padding:12px}
.week{display:flex;gap:6px;align-items:center;font-size:11.5px;padding:3px 4px}
.week .d{width:44px;font-weight:700;color:var(--mut)}
.wk{padding:4px 9px;border-radius:9px;font-weight:700;font-size:11px}
.macro{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-radius:16px;padding:10px 0;text-align:center}
.macro b{display:block;font-size:16px}
.qx{background:var(--card2);border-radius:0 0 15px 15px;margin:-9px 0 2px;padding:14px 12px 11px 62px;display:flex;flex-direction:column;gap:4px}
.qx .li{display:flex;gap:8px;font-size:12px;color:#c4c8d6}
.qx .li span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qx .li span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
.qx .tt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:750;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.qx .acts{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.qx .btn{font-size:12px;padding:6px 12px}
.ap{font-style:normal;font-size:.74em;margin-left:2px;opacity:.7;font-weight:700}
.sk{cursor:pointer;position:relative;transition:height .15s}
.sk:before{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.sk:hover,.sk.drag{height:6px}
.snd{padding:12px 14px;display:flex;flex-direction:column}
.sndc{background:var(--card);border-radius:18px;padding:6px 8px}
.vrow{display:flex;align-items:center;gap:11px;height:40px;padding:0 6px;border-radius:12px;transition:background .2s}
.vrow:hover{background:rgba(255,255,255,.04)}
.vrow.master{height:46px;margin-bottom:4px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.vico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;cursor:pointer;position:relative;background:var(--card2);transition:transform .15s var(--spring)}
.vico:hover{transform:scale(1.1)}
.vico img{width:22px;height:22px;object-fit:contain}
.vrow.muted .vico img{opacity:.35;filter:grayscale(1)}
.vrow.live .vico:after{content:"";position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;border:2px solid var(--bg)}
.vname{width:128px;font-size:13px;font-weight:650;flex:none}
.vrow.master .vname{font-size:13.5px}
.vbar{flex:1;height:6px;border-radius:4px;background:var(--line);position:relative;cursor:pointer;transition:height .15s}
.vbar:before{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.vbar:hover,.vbar.drag{height:8px}
.vbar b{display:block;height:100%;border-radius:4px;background:#f0f2f8;pointer-events:none}
.vrow.muted .vbar b{background:var(--dim)}
.vrow.muted .vname{color:var(--dim)}
.vpct{width:30px;text-align:right;font-size:12px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.dock-left .vname,.dock-right .vname{width:96px}
.mini{display:flex;align-items:center;gap:8px;height:100%;padding:0 13px 0 7px;font-size:12.5px;white-space:nowrap}
.mini .cd{font-weight:750;font-variant-numeric:tabular-nums}
.mini .clock{font-weight:700;color:#d8dbe6;font-variant-numeric:tabular-nums;margin-left:auto}
.mini .art{flex:none}
.playing .art.mm{animation:mmp 2.4s ease-in-out infinite}
@keyframes mmp{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 10px 1px var(--glowc,#1ed760)}}
.cl{font-weight:800;font-size:12px;color:#d97757;padding:2px 8px;border-radius:9px;background:rgba(217,119,87,.16);flex:none}
.cl.ask{animation:clp 1.4s ease-in-out infinite}
@keyframes clp{0%,100%{box-shadow:0 0 0 0 rgba(217,119,87,0)}50%{box-shadow:0 0 12px 2px rgba(217,119,87,.6)}}
.dot-late{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);flex:none}
.mini-side{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;font-size:11px;height:100%}
.mini-side .cd{font-weight:800;font-size:11.5px;line-height:1}
.mini-side .clock{font-weight:800;font-size:10.5px;font-variant-numeric:tabular-nums;margin-top:auto}
.mini-side .cl{padding:2px 5px;font-size:11px}
.s-pill .prog-line.mini-line{left:16px;right:16px;bottom:2px}
.setc{background:var(--card);border-radius:18px;padding:3px 6px}
.setr{display:flex;align-items:center;gap:12px;padding:10px 8px}
.setr+.setr{border-top:1px solid var(--line)}
.setr.wide{flex-direction:column;align-items:stretch;gap:9px}
.seg.wrap{flex-wrap:wrap;flex:1 1 auto;align-self:flex-start;max-width:100%}
.setr .seg:not(.wrap){max-width:62%;overflow-x:auto;scrollbar-width:none}
.sw{width:38px;height:22px;border-radius:11px;background:#2a2f40;position:relative;cursor:pointer;flex:none;transition:background .25s}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .32s var(--spring)}
.sw.on{background:var(--ok)}
.sw.on i{transform:translateX(16px)}
.seg{display:flex;background:var(--bg2);border-radius:11px;padding:2px;gap:2px;flex:none}
.seg span{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:9px;color:var(--mut);cursor:pointer;transition:background .2s,color .2s}
.seg span.on{background:var(--card2);color:#fff}
.tabs div.gear{flex:0 0 44px;display:grid;place-items:center}
.stale{color:var(--warn);font-weight:700}
.semi{position:relative;width:100%;max-width:330px;margin:4px auto 2px;aspect-ratio:330/168}
.semi svg{width:100%;height:100%;overflow:visible}
.semi path.af{transition:stroke-dasharray .7s var(--soft)}
.semi-c{position:absolute;left:0;right:0;top:66%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.semi-c b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.semi-c .k{color:var(--mut);margin-top:6px;font-family:var(--mono);letter-spacing:.12em}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{background:var(--card);border-radius:15px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard .l{font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:7px}
.mcard .l i{width:8px;height:8px;border-radius:50%;flex:none}
.mcard .v b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.mcard .v span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.sys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gauge{background:var(--card);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;min-width:0}
.spark{width:100%;height:30px;margin-top:4px}
.wx{background:linear-gradient(135deg,#1b2340,#161922);border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px}
.wx .temp{font-size:34px;font-weight:850;letter-spacing:-1px}

/* ------------------------------------------------------------------ toast + live */
.toast{padding:14px 18px 14px;display:flex;flex-direction:column;gap:6px}
.toast>*,.toast .col>*{flex-shrink:0}
.toast .ell,.toast .k{line-height:1.35}
.toast .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.toast .tbar{position:absolute;left:30px;right:30px;bottom:5px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.toast .tbar b{display:block;height:100%;background:var(--c);transform-origin:left;animation:tb linear forwards}
@keyframes tb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.live{display:flex;align-items:center;gap:12px;padding:0 12px}
.dock-left .live,.dock-right .live{padding:0 14px}
.pill-top.lm .main{flex:0 1 auto}
.pill-top .clock,.pill-top .cd{white-space:nowrap}
.pill-top .cd2{font-weight:750;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-media.wide{max-width:none;flex:1}
.pill-top .lyrbig{flex:1;min-width:0;color:var(--mut);font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;line-height:1.15}
.pill-top .lyrbig.on{color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--glowc,#fff) 40%,transparent)}
.pill-top .lyrbig.two{white-space:normal;font-size:10.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lyr-p.in,.lyr .la.in{animation:lyf .6s var(--soft)}
@keyframes lyf{from{opacity:0;filter:blur(6px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.pill-top .tiny{font-size:11px;gap:2px}
.lyr .la{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;font-size:14px}
.dots{display:inline-flex;gap:5px;align-items:center;height:1em;vertical-align:middle;padding:0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.lyrbig .w,.lyr .la .w{opacity:.22;filter:blur(1.5px);transition:opacity .3s ease,filter .3s ease}
.lyrbig .w.s,.lyr .la .w.s{opacity:1;filter:none}
/* karaoke fill: the sung part of each syllable / word is bright, the rest dim, with a soft edge that moves with the voice */
.kar .sy{--p:-8%;color:transparent;-webkit-background-clip:text;background-clip:text;text-shadow:none;
  background-image:linear-gradient(90deg,#fff calc(var(--p) - 7%),rgba(255,255,255,.3) calc(var(--p) + 7%))}
.kar.ar .sy{background-image:linear-gradient(270deg,#fff calc(var(--p) - 7%),rgba(255,255,255,.3) calc(var(--p) + 7%))}
.kar .sy.now{filter:drop-shadow(0 0 6px rgba(255,255,255,.32))}
/* full-screen player */
.music{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.music .bgart{position:absolute;inset:-50px;background-size:cover;background-position:center;opacity:.7;filter:blur(42px) saturate(1.6) brightness(.62);animation:drift 30s ease-in-out infinite alternate}
.mshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,12,.25),rgba(8,9,12,.5) 55%,rgba(8,9,12,.85))}
.mtop,.mwin,.mbig,.mbot{position:relative}
.mtop{display:flex;align-items:center;gap:12px;padding:18px 18px 6px}
.mx{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;color:var(--mut);cursor:pointer;flex:none;transition:background .2s,color .2s}
.mx:hover{background:rgba(255,255,255,.1);color:#fff}
.mwin{flex:1;overflow:hidden;padding:0 28px;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 70%,transparent)}
.mlyr{transition:transform .8s var(--soft);will-change:transform}
.ml{font-size:23px;font-weight:780;line-height:1.22;letter-spacing:-.01em;color:rgba(255,255,255,.26);padding:8px 0;transform-origin:left center;
  transition:color .45s ease,transform .6s var(--soft),filter .45s ease;filter:blur(.7px)}
.ml.ar{direction:rtl;text-align:right;transform-origin:right center}
.ml.near{color:rgba(255,255,255,.48);filter:none}
.ml.on{color:#fff;transform:scale(1.05);filter:drop-shadow(0 0 16px color-mix(in srgb,var(--glowc,#fff) 45%,transparent))}
.ml.on .w{opacity:.3;filter:none;transition:opacity .25s ease}
.ml.on .w.s{opacity:1}
.mbig{flex:1;display:grid;place-items:center;min-height:0}
.mrz{position:absolute;right:6px;bottom:6px;width:22px;height:22px;z-index:5;cursor:nwse-resize;border-radius:0 0 18px 0;opacity:.35;transition:opacity .2s;
  background:linear-gradient(135deg,transparent 0 52%,rgba(255,255,255,.75) 52% 58%,transparent 58% 68%,rgba(255,255,255,.75) 68% 74%,transparent 74%)}
.mrz.l{right:auto;left:6px;cursor:nesw-resize;border-radius:0 0 0 18px;transform:scaleX(-1)}
.music:hover .mrz,#isl.rzing .mrz{opacity:.9}
#isl.rzing *{transition:none!important}
/* vinyl mode (r30): the cover is the record's label, the record spins at 33 rpm while playing, the tonearm drops on */
.vwrap{position:relative;width:300px;height:262px;zoom:1.22;flex:none}
.vglow{position:absolute;left:22px;top:17px;width:226px;height:226px;border-radius:50%;background:var(--glowc,#1ed760);opacity:.22;filter:blur(38px);transition:opacity .8s}
.vwrap.spin .vglow{opacity:.38}
.vrec{position:absolute;left:10px;top:5px;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,transparent 0 21%,rgba(0,0,0,.55) 21.5% 23%,transparent 23.5% 96%,rgba(255,255,255,.07) 97%,#050506 98.5%),
    repeating-radial-gradient(circle,#0c0c0f 0 1.15px,#1b1b20 1.6px,#0c0c0f 2.3px);
  box-shadow:0 22px 50px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06);
  animation:vspin 1.8s linear infinite;animation-play-state:paused}
.vwrap.spin .vrec{animation-play-state:running}
@keyframes vspin{to{transform:rotate(360deg)}}
.vlab{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:#2a2d35 center/cover;
  box-shadow:0 0 0 3px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.12)}
.vhole{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f4f4f6,#8b8f99);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.vshine{position:absolute;left:10px;top:5px;width:250px;height:250px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 25deg,transparent 0 6%,rgba(255,255,255,.13) 11%,transparent 17%,transparent 50%,rgba(255,255,255,.09) 57%,transparent 64%);
  -webkit-mask:radial-gradient(circle,transparent 0 21%,#000 22%)}
.vtone{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.varm{transform:rotate(0deg);transition:transform 1s cubic-bezier(.3,.75,.25,1)}
.vwrap.spin .varm{transform:rotate(20deg)}
.music .mtop .mx.on{color:var(--glowc,#1ed760)}
/* the song name never hides: it wraps to two lines and gets a bit smaller when the player is small (r33) */
.mtt{font-size:16px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.music.narrow .mtt{font-size:14px}
.music.narrow .mtop{gap:9px;padding:14px 12px 4px}
.music.narrow .mtop .art{width:40px!important;height:40px!important}
.music.narrow .eq{display:none}
.mbot{padding:4px 20px 18px}
.mbot .ctl{margin-top:12px}
.mbot .ctl span.mxa,.mbot .ctl span.mxb{width:auto;height:auto;background:none;transform:none;display:contents}
/* round 3: HUD, command bar, timers, dots */
.hud{display:flex;align-items:center;gap:11px;height:100%;padding:0 16px 0 13px;font-size:13px}
.hud .hi{width:24px;height:24px;display:grid;place-items:center;color:var(--c);flex:none}
.hud .hi.txt{width:auto;min-width:26px;padding:0 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,transparent);font-weight:800;font-size:12px;height:22px}
.hud .ht{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:none;max-width:62%}
.hud .ht:last-child{max-width:none;flex:0 1 auto}   /* a HUD with only a message: it may use the whole (already widened) pill */
.hud .hb{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.hud .hb b{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .18s var(--soft)}
.hud .hr{color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .hb + .hr{margin-left:0;min-width:24px;text-align:right}
.hud img{height:64px;border-radius:9px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hud .hcol{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.hud .btn{font-size:12px;padding:5px 11px}
.cmd{display:flex;flex-direction:column;height:100%;padding:8px 10px}
.cin{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px}
.cin .cic{color:var(--acc);font-weight:800}
.cin input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px;font-weight:600}
.cin input::placeholder{color:var(--dim);font-weight:500}
.csug{display:flex;flex-direction:column;gap:2px}
.csug div{display:flex;gap:12px;align-items:center;height:34px;padding:0 10px;border-radius:10px;cursor:pointer;font-size:13px}
.csug div.on,.csug div:hover{background:var(--card2)}
.csug b{font-weight:700;white-space:nowrap}
.csug span{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr{display:inline-flex;align-items:center;gap:5px;font-weight:750;font-size:12px;color:#f59e0b;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;padding:2px 4px;border-radius:9px}
.tmr:hover{background:rgba(245,158,11,.12)}
.tmr.arm{color:var(--bad)}
.pd{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none;cursor:pointer}
/* ---- look v2: the clean pill (one thing per spot: what's next + its time | song | streak, water | clock) */
.pill-top.pc{gap:16px;padding:0 17px 0 7px}
.pc-lead{position:relative;flex:none;display:grid}
.pc-late{position:absolute;top:-2px;right:-3px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;
  font-style:normal;font-size:9.5px;font-weight:800;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);font-variant-numeric:tabular-nums}
.pill-top.pc .main{flex-direction:column;align-items:flex-start;gap:1px;line-height:1.12;margin-left:-6px}
.pill-top.pc .main .t{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.pc-sub{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:0}
.pc-m{gap:9px;max-width:170px}
.pc-m .art{position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pc-m .art .eq{position:absolute;inset:auto 0 0 0;height:13px;padding:0 0 2px;justify-content:center;gap:1.5px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.pc-m .art .eq i{width:2.5px;background:#fff}
.pc-m .art .eq i{height:9px;transform:scaleY(.33)}
.playing .pc-m .art .eq i,.pc-m.playing .art .eq i{animation:eqs .9s infinite ease-in-out}
@keyframes eqs{0%,100%{transform:scaleY(.33)}50%{transform:scaleY(1)}}
.pc-m span{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.pc-x{display:flex;align-items:center;gap:8px;min-width:0}
.pc-st{display:flex;align-items:center;gap:12px;flex:none}
.pc-st .ico{font-size:12.5px;font-weight:700;gap:4px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--fg) 86%,transparent)}
.pc-st .ico.z{color:var(--dim)}
.pill-top.pc .clock{font-size:13.5px;font-weight:700;margin-left:-2px}
.pd2{display:grid;place-items:center;color:var(--c);flex:none;cursor:pointer;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 70%,transparent))}
.pill-top.pc.tight{gap:11px}
/* ---- look v2: settings = one group at a time, search, toggle tiles */
.setq{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px;border-radius:14px;background:var(--card);color:var(--mut);margin:2px 0 10px}
.setq input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:13px;font-weight:600}
.setq input::placeholder{color:var(--dim)}
.setnav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-bottom:12px;padding:4px;border-radius:16px;background:var(--bg2)}
.setnav span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:12px;color:var(--dim);cursor:pointer;transition:background .2s,color .2s}
.setnav span:hover{color:var(--mut)}
.setnav span.on{background:var(--card2);color:var(--fg)}
.setnav span.on svg{color:var(--acc)}
.setnav b{font-size:9.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.setg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 10px}
.stile{display:flex;align-items:center;gap:10px;min-height:48px;padding:9px 12px;border-radius:15px;background:var(--card);cursor:pointer;
  border:1px solid transparent;transition:background .2s,border-color .2s,transform .15s var(--spring)}
.stile:active{transform:scale(.97)}
.stile>svg{flex:none;color:var(--dim);transition:color .2s}
.stile span{flex:1;min-width:0;font-size:12.5px;font-weight:650;line-height:1.25;color:var(--mut)}
.stile i{width:16px;height:16px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;transition:all .2s}
.stile.on{background:color-mix(in srgb,var(--acc) 13%,var(--card));border-color:color-mix(in srgb,var(--acc) 32%,transparent)}
.stile.on>svg{color:var(--acc)}
.stile.on span{color:var(--fg)}
.stile.on i{border-color:var(--acc);background:var(--acc)}
.stile.on i::after{content:"";width:6px;height:3.5px;border:2px solid #0a0b0f;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.setc .setr .ds{font-size:11px;line-height:1.35}
.setth{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:2px 0 10px}
.thc{display:flex;flex-direction:column;gap:7px;padding:7px 7px 9px;border-radius:16px;background:var(--card);cursor:pointer;border:1.5px solid transparent;transition:border-color .2s,transform .15s var(--spring)}
.thc:active{transform:scale(.96)}
.thc.on{border-color:var(--a)}
.thc .thp{height:46px;border-radius:11px;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--a) 30%,transparent),transparent 60%),var(--b);position:relative;overflow:hidden}
.thc .thp b{position:absolute;left:9px;right:9px;top:15px;height:16px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.thc .thp b::before{content:"";position:absolute;left:4px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.thc .thp b::after{content:"";position:absolute;left:16px;top:6px;width:38%;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.thc .thp .ab{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(9px) saturate(1.3) brightness(.6)}
.thc em{font-style:normal;font-size:12px;font-weight:700;text-align:center;color:var(--mut)}
.thc.on em{color:var(--fg)}
.setb{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.vspin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:vsp .8s linear infinite;flex:none;margin-right:6px}
@keyframes vsp{to{transform:rotate(360deg)}}
.vok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);flex:none}
.setb .btn{font-size:12px;padding:8px 13px;display:flex;align-items:center;gap:6px}
.offl{font-size:11px;font-weight:750;color:var(--bad);white-space:nowrap}
body.priv .toast .t,body.priv .toast .ell,body.priv #p-Body .semi,body.priv #p-Body .mgrid,body.priv #p-Body .it .t,body.priv .lyr,body.priv .lyrbig{filter:blur(7px)}
/* pill player */
.mpill{position:relative;height:100%;display:flex;align-items:center;gap:16px;padding:0 26px 0 20px;overflow:hidden;animation:mpin .55s var(--soft)}
@keyframes mpin{from{opacity:0;transform:scale(.97)}}
.mpill .bgart{position:absolute;inset:-40px;background-size:cover;background-position:center;opacity:.8;filter:blur(30px) saturate(1.7) brightness(.62);animation:drift 28s ease-in-out infinite alternate}
.mpill .mshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,12,.62),rgba(8,9,12,.3) 60%,rgba(8,9,12,.45))}
.mpill>.art,.mpmid{position:relative}
.mpart{width:88px;height:88px;border-radius:20px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .25s var(--spring)}
.mpart:hover{transform:scale(1.04)}
.mpmid{flex:1;min-width:0;display:flex;flex-direction:column}
.mpk{display:flex;align-items:center;gap:8px;min-width:0;height:16px}
.mpk .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;flex:none}
.mpk .mpt{display:none;font-size:11.5px;color:rgba(255,255,255,.6);min-width:0}
.mpk .mpt b{color:rgba(255,255,255,.9);font-weight:650}
.mpk .eq{margin-left:auto;transform:scale(.8);transform-origin:right center}
.mpill:has(.lyr.on) .mpk .mpt{display:block}
.mpno{display:flex;flex-direction:column;gap:2px;margin-top:3px;min-width:0}
.mpno .t{font-size:19px;font-weight:760;letter-spacing:-.01em}
.mpno .ds{font-size:13px;color:rgba(255,255,255,.62)}
.mpill:has(.lyr.on) .mpno{display:none}
.mpill .lyr{margin-top:4px;min-height:0;gap:3px}
.mpill .lyr .la{font-size:19px;font-weight:760;letter-spacing:-.01em;line-height:1.22;-webkit-line-clamp:2;text-shadow:0 0 18px color-mix(in srgb,var(--glowc) 40%,transparent)}
.mpill .lyr .lb{font-size:12.5px;color:rgba(255,255,255,.46)}
.mpill .bar{margin-top:9px;height:3px}
.mpr{position:absolute;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px;
  padding:0 30px 0 70px;background:linear-gradient(90deg,transparent,rgba(8,9,12,.7) 38%);opacity:0;pointer-events:none;transition:opacity .25s ease}
.mpill:hover .mpr{opacity:1;pointer-events:auto}
.mptop{display:flex;gap:2px;align-items:center}
.mptop .mx{width:26px;height:26px}
.mpr .ctl{margin-top:0;gap:2px}
.mpr .ctl span{width:28px;height:28px}
.mpr .ctl span.pp{width:34px;height:34px}
.mpr .ctl span.xb{width:24px;height:24px}
.mpr .ctl span.mxa,.mpr .ctl span.mxb{width:auto;height:auto;background:none;transform:none;display:contents}
body:not(.dock-top) .mpill{gap:12px;padding:0 18px}
body:not(.dock-top) .mpart{width:60px;height:60px;border-radius:15px}
body:not(.dock-top) .mpill .lyr .la,body:not(.dock-top) .mpno .t{font-size:15.5px}
body:not(.dock-top) .mpr{padding:0 18px 0 40px}
/* quick launch + bluetooth */
.lnch{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.lnch span{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:transform .18s var(--spring),background .2s}
.lnch span:hover{transform:translateY(-2px) scale(1.06);background:rgba(255,255,255,.1)}
.lnch img{width:26px;height:26px;border-radius:6px;pointer-events:none}
.lnch span{position:relative}
.lnch .ladd{background:transparent;border:1px dashed rgba(255,255,255,.14);color:var(--dim)}
.lnch .ladd:hover{color:var(--fg);border-color:rgba(255,255,255,.3)}
.lnch.edit span[data-i]{animation:lwig .32s ease-in-out infinite alternate;cursor:grab}
.lnch.edit span[data-i]:nth-child(2n){animation-delay:-.16s}
.lnch.edit span.ldrag{opacity:.4}
.lnch.edit span[data-i]:hover{transform:none;background:rgba(255,255,255,.1)}
@keyframes lwig{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.lnch .lx{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#3a3f4d;color:#fff;font-size:12px;line-height:18px;text-align:center;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.lnch .lx:hover{background:var(--bad)}
.lnch .ldone{width:auto;padding:0 12px;font-size:12px;font-weight:700;color:var(--ok);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.2)}
.lpick{margin:-4px 0 14px;padding:8px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.csug .cds{margin:0;padding:9px 14px;font-size:12.5px;color:var(--mut)}
.lpick input{width:100%;box-sizing:border-box;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);color:var(--fg);padding:0 11px;font:inherit;font-size:13px;outline:none}
.lpick input:focus{border-color:rgba(167,139,250,.5)}
.lpick #lpr{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.lpick #lpr div{padding:7px 10px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--fg)}
.lpick #lpr div:hover{background:rgba(255,255,255,.07)}
.lpick #lpr .ds{cursor:default;padding:6px 10px}
.lpick #lpr .ds:hover{background:none}
.lnch b{font-size:15px;font-weight:750;color:var(--fg)}
.btr{display:grid;grid-template-columns:1fr 70px 34px;align-items:center;gap:9px;font-size:12px}
.btr i{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.btr i b{display:block;height:100%;border-radius:3px}
.btr .mut{text-align:right;font-variant-numeric:tabular-nums}
/* auto-hide: the pill folds into a thin line at the edge */
#isl.tucked{border-color:transparent;background:color-mix(in srgb,var(--tint,#a78bfa) 55%,#fff);box-shadow:0 0 14px -2px var(--tint,#a78bfa)}
#isl.tucked .layer{opacity:0!important;pointer-events:none}
/* shelf */
.shc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:rgba(96,165,250,.14);color:#93c5fd;font-size:11.5px;font-weight:700;cursor:pointer;flex:none}
.shc:hover{background:rgba(96,165,250,.24)}
.shelf{height:100%;display:flex;flex-direction:column;padding:12px 12px 10px;gap:2px}
.shh{display:flex;align-items:center;gap:10px;padding:2px 6px 8px;font-size:11.5px}
.shh .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;color:#93c5fd}
.shx{cursor:pointer;color:var(--mut);padding:2px 8px;border-radius:8px}
.shx:hover{background:rgba(255,255,255,.08);color:#fff}
.shr{display:flex;align-items:center;gap:11px;height:48px;padding:0 8px;border-radius:13px;cursor:grab;transition:background .15s}
.shr:hover{background:rgba(255,255,255,.06)}
.shr:active{cursor:grabbing}
.shr img{width:30px;height:30px;flex:none;-webkit-user-drag:none;pointer-events:none}
.shi{width:30px;height:30px;display:grid;place-items:center;color:#93c5fd;flex:none}
.shb{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--mut);cursor:pointer;flex:none;opacity:0;transition:opacity .15s,background .15s}
.shr:hover .shb{opacity:1}
.shb:hover{background:rgba(255,255,255,.1);color:#fff}
#isl.dropping{border-color:rgba(96,165,250,.8);box-shadow:0 0 0 2px rgba(96,165,250,.45),0 0 40px -4px rgba(96,165,250,.7)}
#isl.dropping:after{content:"Drop to keep it here";position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;
  background:rgba(10,14,24,.88);color:#bfdbfe;font-size:13px;font-weight:700;letter-spacing:.01em;z-index:9;pointer-events:none}
/* dashboard */
body.dash{background:#07080b}
body.dash #isl{top:0;left:0;transform:none;border-radius:0;border:0;box-shadow:none;transition:none;
  background:radial-gradient(90% 70% at 85% 0%,color-mix(in srgb,var(--tint,#a78bfa) 14%,transparent),transparent 60%),#07080b}
.dash{height:100%;display:flex;flex-direction:column;padding:34px 42px 30px;gap:26px;overflow:hidden}
.dhead{display:flex;align-items:center;gap:26px}
.dclock{display:flex;align-items:baseline;gap:6px}
.dclock b{font-size:86px;font-weight:800;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.dclock span{font-size:20px;color:var(--mut);font-weight:650}
.dday{font-size:24px;font-weight:700;letter-spacing:-.01em}
.dwx{display:flex;align-items:center;gap:12px}
.dwx b{font-size:30px;font-weight:780}
.dx{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--dim);cursor:pointer;opacity:.35;transition:opacity .2s,background .2s}
.dx:hover{opacity:1;background:rgba(255,255,255,.08)}
.dgrid{flex:1;display:grid;grid-template-columns:1.05fr 1.35fr 1fr;gap:24px;min-height:0}
.dcol{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dmusic{position:relative;flex:1;min-height:380px;border-radius:30px;overflow:hidden;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;background:#101218}
.dmusic.empty{align-items:center;justify-content:center;gap:10px}
.dmusic .bgart{position:absolute;inset:-60px;background-size:cover;background-position:center;opacity:.75;filter:blur(46px) saturate(1.6) brightness(.6);animation:drift 30s ease-in-out infinite alternate}
.dmusic .mshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,12,.1),rgba(8,9,12,.75))}
.dmusic .k{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:750}
.dmusic .lyr,.dmusic .ctl,.dmusic .xb{position:relative}
.dmusic .lyr{min-height:0;gap:6px}
.dmusic .lyr .la{font-size:34px;font-weight:800;line-height:1.18;letter-spacing:-.015em;-webkit-line-clamp:3;text-shadow:0 0 26px color-mix(in srgb,var(--glowc) 40%,transparent)}
.dmusic .lyr .lb{font-size:18px;color:rgba(255,255,255,.5)}
.dmusic .ctl{margin-top:0}
.dmusic .ctl span{width:40px;height:40px}
.dmusic .ctl span.pp{width:50px;height:50px}
@media (max-width:1300px){.dgrid{grid-template-columns:1fr 1.2fr}.dgrid #d-side{display:none}}
/* study */
.exr{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
/* study tab v2 (r27): what to do now, then everything else small */
.shero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;margin:2px 0 10px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 20%,var(--card,#14161c)),var(--card,#14161c) 75%);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.shero.guard{animation:gpulse 1.2s ease-in-out infinite}
.shero .bd{flex:none;border-radius:16px}
.shk{font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.sht{font-size:16.5px;font-weight:750;line-height:1.3;color:#fff}
.sht.ar,.shd.ar,.sgx.ar{direction:rtl;text-align:right;font-family:var(--ar,inherit)}
.shd{font-size:12.5px;color:var(--mut)}
.shm{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.shic{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.sacts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sbig{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:750;cursor:pointer;
  background:rgba(255,255,255,.08);color:#e5e7eb;transition:background .15s,transform .12s}
.sbig:hover{background:rgba(255,255,255,.15)}
.sbig:active{transform:scale(.95)}
.sbig.go{background:var(--c,#a78bfa);color:#0b0c10}
.sbig.go:hover{filter:brightness(1.1)}
.sbig.ok{background:rgba(74,222,128,.16);color:#86efac}
.sbig.ic{width:34px;padding:0;justify-content:center}
.stoday{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sti{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:12px;font-size:11.5px;font-weight:700;cursor:pointer;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sti > i{display:grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--c);color:#0b0c10}
.sti.done{opacity:.55;text-decoration:line-through}
.sti.done > i{background:var(--c)}
.sti.now{box-shadow:0 0 0 1.5px var(--c) inset}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sgt{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:16px;background:var(--card);min-width:0}
.sgp{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.sgn{font-size:13.5px;font-weight:750}
.sgs{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700}
.sgs i{width:6px;height:6px;border-radius:50%}
.sgx{font-size:11.5px;color:var(--mut)}
.sfw{padding:2px 2px 6px}
.sfb{display:flex;gap:3px;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.06)}
.sfb b{display:block;height:100%;min-width:4px}
.sfl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--mut)}
.sfl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.smore{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;margin:8px 0 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;background:rgba(255,255,255,.04)}
.smore:hover{background:rgba(255,255,255,.08);color:#fff}
.smore span{transition:transform .25s}
.sempty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:34px 22px;color:var(--mut)}
.sempty b{font-size:16px;color:#fff}
.sempty span{font-size:13px;line-height:1.45;max-width:330px}
.sempty .sbig{margin-top:6px}
.bigset{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;cursor:pointer;color:var(--mut);background:rgba(255,255,255,.05)}
.bigset b{font-size:13px;color:#fff}
.bigset span{font-size:11px}
.bigset:hover{background:rgba(255,255,255,.1)}
.cdc{cursor:pointer}
.welc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;margin:2px 0 10px;
  background:linear-gradient(150deg,rgba(167,139,250,.18),var(--card,#14161c) 70%);border:1px solid rgba(167,139,250,.3)}
.wlt{font-size:14.5px}
.wlr{display:flex;gap:11px;align-items:center}
.wlr b{font-size:13px}
.wlr span{font-size:11.5px;color:var(--mut)}
.wli{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;flex:none;color:#c4b5fd;background:rgba(167,139,250,.14)}
.cdc.isbig{box-shadow:0 0 0 1.5px #fbbf24 inset}
.exc{display:flex;align-items:baseline;gap:5px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);cursor:pointer}
.exc b{font-size:16px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.exc span{font-size:11.5px;color:var(--mut)}
.exc b:after{content:"d";font-size:10px;font-weight:700;margin-left:1px;opacity:.8}
.exc.tbc span:after{content:" ?";opacity:.6}
.exc.hot{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.5)}
.exc.hot b{color:var(--bad)}
.pomoc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--card,#14161c));border:1px solid color-mix(in srgb,var(--c) 25%,transparent);margin-bottom:6px}
.pomoc.guard{animation:gpulse 1.2s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 0 0 3px rgba(251,113,133,.35)}}
.mins{display:flex;flex-direction:column;gap:7px;padding:2px 4px 4px}
.minr{display:grid;grid-template-columns:62px 1fr 52px;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.minr i{height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.minr i b{display:block;height:100%;border-radius:4px;transition:width .6s var(--soft)}
.minr em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.sbtn{display:inline-grid;place-items:center;height:24px;padding:0 9px;border-radius:12px;background:rgba(255,255,255,.06);font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;flex:none;transition:background .15s,color .15s}
.sbtn:hover{background:rgba(255,255,255,.13);color:#fff}
.sbtn:active{transform:scale(.94);background:rgba(255,255,255,.18)}
.sbtn.ic{width:28px;height:28px;padding:0;border-radius:14px;margin-right:6px}
.ppw{display:flex;flex-direction:column;gap:10px}
.ppr{padding:10px 12px;border-radius:14px;background:var(--card,#14161c)}
.ppc{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ppx{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:650;color:var(--mut);background:rgba(255,255,255,.05);cursor:pointer;font-variant-numeric:tabular-nums}
.ppx.mk{border:1px dashed rgba(255,255,255,.18)}
.ppx.miss{opacity:.4}
.ppx b{font-weight:800}
.ppx.good{background:rgba(74,222,128,.14);color:#86efac}
.ppx.low{background:rgba(251,113,133,.14);color:#fda4af}
.tmr.mock{background:rgba(251,113,133,.16);color:#fda4af}
.tmr.mock i{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:750;opacity:.85}
#isl.guard{border-color:rgba(251,113,133,.85);box-shadow:0 0 0 2px rgba(251,113,133,.4),0 0 44px -4px rgba(251,113,133,.85)}
/* review cards */
.fcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,var(--card,#14161c)),var(--card,#14161c) 70%);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.fcard.open{cursor:default}
.fcard .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:750}
.fcard .ff{font-size:14.5px;font-weight:700;line-height:1.3}
.fcard .fb{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.28);line-height:1.4;animation:ly .35s var(--soft)}
.fcard .fh{opacity:.7}
.fcard .fa{gap:8px}
.fcard .fa span{flex:1;text-align:center;padding:7px 0;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s}
.fcard .fa .bad{background:rgba(251,113,133,.14);color:#fda4af}
.fcard .fa .ok{background:rgba(74,222,128,.14);color:#86efac}
.fcard .fa .bad:hover{background:rgba(251,113,133,.25)}
.fcard .fa .ok:hover{background:rgba(74,222,128,.25)}
.fcard.peek{height:100%;justify-content:center;padding:14px 16px}
.fcard.peek .ff{font-size:14px}
.fcard.peek .fb{font-size:13.5px;padding:6px 9px}
.tbadge{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--tint,#a78bfa);color:#0a0b0f;font-size:10px;font-weight:800;vertical-align:1px}
/* prayer */
.prc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:rgba(94,234,212,.13);color:#5eead4;font-size:11.5px;font-weight:650;flex:none;white-space:nowrap}
.prc b{font-weight:800}
.prs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 0 12px;padding:8px;border-radius:16px;background:var(--card,#14161c)}
.pyi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:11px;font-size:10.5px;color:var(--mut)}
.pyi b{font-size:13px;font-weight:750;color:var(--fg);font-variant-numeric:tabular-nums}
.pyi i{font-style:normal;font-size:9.5px;color:#5eead4;font-weight:700}
.pyi.nx{background:rgba(94,234,212,.12)}
.pyi.nx span,.pyi.nx b{color:#5eead4}
.pyi.past{opacity:.45}
.pyi.sun{opacity:.55}
/* life */
.wod{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;padding:9px 12px;border-radius:14px;background:var(--card,#14161c);font-size:12.5px;min-width:0}
/* ---- today v2: word card with the article in its colour + a sentence */
.wod2{display:flex;flex-direction:column;gap:5px;margin:0 0 12px;padding:11px 14px 12px;border-radius:16px;background:var(--card,#14161c);min-width:0;cursor:pointer}
.wod2 .wr{display:flex;align-items:baseline;gap:8px;min-width:0}
.wod2 .k{font-size:10px;font-weight:800;letter-spacing:.08em;color:#fbbf24;flex:none}
.wod2 .gart{font-size:14.5px;font-weight:800;flex:none}
.wod2 .gart.der{color:#60a5fa}.wod2 .gart.die{color:#f472b6}.wod2 .gart.das{color:#4ade80}.wod2 .gart.pl{color:#f472b6}
.wod2 .w{font-size:15px;font-weight:750;flex:none}
.wod2 .h{font-size:11.5px;color:var(--dim);font-weight:650;flex:none}
.wod2 .m{font-size:12.5px;color:var(--mut);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wod2 .ex{font-size:13px;color:color-mix(in srgb,var(--fg) 88%,transparent);font-style:italic;line-height:1.4}
.wod2 .ex b{font-style:normal;font-weight:750;color:var(--fg);border-bottom:1.5px solid color-mix(in srgb,var(--wc,#fbbf24) 70%,transparent)}
.wod2 .en{font-size:11.5px;color:var(--dim);line-height:1.35}
.wod2.short .ex,.wod2.short .en{display:none}
.wsay{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin:-5px -6px -5px 0;border-radius:50%;color:var(--mut);cursor:pointer;vertical-align:middle;transition:background .15s,color .15s}
.wsay:hover{background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--fg)}
.wsay:active{transform:scale(.9)}
.wod .wsay{margin-left:auto}.wod .mut{flex:1;min-width:0}
.wod2 .ex .wsay{width:22px;height:22px;margin:-3px 0 -4px 4px;font-style:normal}
.wsay.on{color:var(--acc)}
/* ---- today v2: the day at a glance */
.dstrip{position:relative;margin:2px 2px 4px;padding:14px 0 30px}
.dstrip .ln{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.045)}
.dstrip .sg{position:absolute;top:0;height:12px;border-radius:6px;background:color-mix(in srgb,var(--c) 34%,transparent);cursor:pointer;min-width:6px;transition:filter .2s}
.dstrip .sg.done{background:var(--c)}
.dstrip .sg.late{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.dstrip .sg.now{background:linear-gradient(90deg,var(--c) var(--f),color-mix(in srgb,var(--c) 34%,transparent) var(--f));box-shadow:0 0 12px -2px var(--c)}
.dstrip .sg:hover{filter:brightness(1.25)}
.dstrip .dt{position:absolute;top:31px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:color-mix(in srgb,var(--c) 40%,transparent);border:1.5px solid var(--c);cursor:pointer}
.dstrip .dt.done{background:var(--c)}
.dstrip .nw{position:absolute;top:9px;bottom:26px;width:2px;margin-left:-1px;border-radius:1px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
.dstrip .nw i{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;font-weight:800;color:#fff;white-space:nowrap}
.dstrip .tk{position:absolute;bottom:0;font-size:9.5px;font-weight:700;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
/* ---- today v2: detailed / compact */
.tdv{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--bg2);margin-left:8px}
.tdv span{display:grid;place-items:center;width:26px;height:20px;border-radius:7px;color:var(--dim);cursor:pointer;letter-spacing:0}
.tdv span.on{background:var(--card2);color:var(--fg)}
.it .wrap{white-space:normal;line-height:1.45;margin-top:3px;font-size:12.5px;color:#b9bdd0}
.it .ds.wrap{color:var(--mut)}
.it .steps{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.it .stp{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.4;color:#c9ccd8}
.it .stp.ar{flex-direction:row-reverse;text-align:right}
.it .stp b{flex:none;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#0a0b0f;background:var(--c);margin-top:1px}
.it .brk{display:inline-flex;align-self:flex-end;gap:5px;align-items:center;font-size:11px;font-weight:700;color:#f59e0b;padding:2px 9px;border-radius:9px;background:rgba(245,158,11,.12)}
.it .stp.ar + .brk,.it .brk.ar{align-self:flex-end}
.it .foods{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.it .foods span{font-size:11px;font-weight:650;padding:3px 8px;border-radius:8px;background:var(--bg2);color:#c4c8d6}
.it .foods span em{font-style:normal;color:var(--mut);margin-right:4px;font-variant-numeric:tabular-nums}
.it .itbar{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.it .itbar b{display:block;height:100%;background:var(--c);border-radius:2px}
.it.now{padding-bottom:13px}
.it .swb{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--dim);flex:none;cursor:pointer;opacity:0;transition:opacity .2s,background .2s,color .2s}
.it:hover .swb,.it.swsrc .swb{opacity:1}
.it .swb:hover{background:var(--card2);color:var(--fg)}
.it.swsrc{box-shadow:inset 0 0 0 1.5px var(--c),0 0 22px -6px var(--c)}
.it.swsrc .swb{background:var(--c);color:#0a0b0f}
.it.swdst{cursor:pointer;outline:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);outline-offset:-1.5px}
.it.swdst:hover{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.it.swoff{opacity:.38}
.swhere{font-size:11px;font-weight:800;padding:3px 10px;border-radius:9px;background:var(--c);color:#0a0b0f;white-space:nowrap}
.mvd{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:750;color:#f59e0b;white-space:nowrap}
.swbar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--c,#a78bfa) 14%,var(--card));font-size:12.5px;font-weight:650}
.swbar .btn{font-size:11.5px;padding:5px 11px}
.it.fold{cursor:pointer;background:transparent;border:1px dashed var(--line);padding:8px 12px}
.it.fold:hover{background:var(--card)}
.it.fold .t{font-size:12.5px;color:var(--mut)}
.it.pulse2{animation:itp 1.2s var(--soft)}
@keyframes itp{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}}
/* ---- right-click menu: the island opens into it */
.imenu{display:flex;flex-direction:column;gap:10px;padding:14px;height:100%}
.imtop{display:flex;align-items:center;justify-content:space-between;padding:0 2px 0 6px;margin-bottom:-2px}
.imtop b{font-size:12px;font-weight:750;letter-spacing:.04em;color:var(--mut)}
.imx{display:grid;place-items:center;width:30px;height:30px;border-radius:15px;background:var(--card);color:var(--mut);cursor:pointer;transition:background .15s,color .15s,transform .12s}
.imx:hover{background:var(--card2);color:#fff}
.imx:active{transform:scale(.92)}
.imh{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.imh span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--card);cursor:pointer;font-size:11.5px;font-weight:700;color:var(--mut);transition:background .2s,transform .15s var(--spring),color .2s}
.imh span:hover{background:var(--card2);color:var(--fg);transform:translateY(-2px)}
.imh span svg{color:var(--fg)}
.imh span.on{background:color-mix(in srgb,var(--acc) 22%,var(--card));color:var(--fg)}
.imr{display:flex;align-items:center;gap:10px;padding:2px 4px}
.imr>span{flex:1;font-size:12.5px;font-weight:650;color:var(--mut)}
.imr .seg span{padding:5px 11px}
.imr .seg span .mn{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-left:4px;vertical-align:middle}
.imt{display:flex;gap:6px;flex-wrap:wrap}
.imt span{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;background:var(--card);font-size:12px;font-weight:650;color:var(--mut);cursor:pointer;border:1px solid transparent}
.imt span i{width:14px;height:14px;border-radius:50%;border:2px solid var(--dim)}
.imt span.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.imt span.on i{border-color:var(--acc);background:var(--acc)}
.imf{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.imf span{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 4px;border-radius:11px;font-size:11.5px;font-weight:700;color:var(--mut);cursor:pointer}
.imf span:hover{background:var(--card);color:var(--fg)}
.imf span.q{color:var(--bad)}
.imf span.q.arm{background:var(--bad);color:#fff}
/* ---- voice: a Siri-style orb */
.vo{display:flex;align-items:center;gap:14px;height:100%;padding:0 22px 0 14px}
.vorb{--lv:0;position:relative;width:44px;height:44px;flex:none;border-radius:50%;filter:saturate(1.3);transform:scale(calc(.9 + var(--lv) * .35));transition:transform .08s linear}
.vorb i{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;filter:blur(4px);animation:vspin 3.2s linear infinite}
.vorb i:nth-child(1){background:radial-gradient(circle at 30% 35%,#ff4fd8,transparent 62%)}
.vorb i:nth-child(2){background:radial-gradient(circle at 70% 40%,#3b82f6,transparent 60%);animation-duration:2.4s;animation-direction:reverse}
.vorb i:nth-child(3){background:radial-gradient(circle at 50% 75%,#22d3ee,transparent 60%);animation-duration:4s}
.vorb::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.15) 60%,transparent 70%);opacity:calc(.35 + var(--lv) * .6)}
.vo.thinking .vorb i{animation-duration:1s}
.vo.thinking .vorb{animation:br 1.2s infinite ease-in-out}
.vo.done .vorb i:nth-child(1){background:radial-gradient(circle at 40% 40%,#4ade80,transparent 62%)}
.vo.error .vorb i{background:radial-gradient(circle,#fb7185,transparent 62%)}
@keyframes vspin{to{transform:rotate(360deg)}}
.vtx{flex:1;min-width:0;gap:2px}
.vtx .k{color:var(--mut)}
.vtx .t{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vo.answer .vtx .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.vo.answer .vtx .t{white-space:normal;font-size:13.5px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.vo.answer .vorb i:nth-child(2){background:radial-gradient(circle at 60% 40%,#a78bfa,transparent 60%)}
.vo.done .vtx .k{color:var(--ok)}
.vo.error .vtx .k{color:var(--bad)}
/* ---- command center v2 */
.cmd2{display:flex;flex-direction:column;height:100%;padding:10px 12px 14px;gap:8px}
.cin2{display:flex;align-items:center;gap:11px;height:46px;padding:0 6px 0 10px;border-radius:16px;background:var(--card)}
.cin2>svg{color:var(--mut);flex:none}
.cin2 input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15.5px;font-weight:600}
.cin2 input::placeholder{color:var(--dim);font-weight:500}
.cmic{--lv:0;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;cursor:pointer;color:var(--mut);transition:background .2s,color .2s}
.cmic:hover{background:var(--card2);color:var(--fg)}
.cmic.on{background:linear-gradient(135deg,#ff4fd8,#3b82f6);color:#fff;box-shadow:0 0 calc(8px + var(--lv) * 22px) rgba(120,120,255,.7)}
.ctiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ctile{display:flex;flex-direction:column;gap:7px;padding:11px 12px;border-radius:15px;background:var(--card);cursor:pointer;transition:background .2s,transform .15s var(--spring)}
.ctile:hover{background:var(--card2);transform:translateY(-2px)}
.ctile svg{color:var(--c,var(--acc))}
.ctile b{font-size:12.5px;font-weight:700}
.ctile small{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crec{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 2px}
.crec>span:first-child{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.crec .rc{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:9px;background:var(--bg2);color:var(--mut);cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crec .rc:hover{color:var(--fg);background:var(--card2)}
.csug2{display:flex;flex-direction:column;gap:2px}
.csug2>.cr{display:flex;gap:11px;align-items:center;height:42px;padding:0 10px;border-radius:12px;cursor:pointer;font-size:13px}
.csug2>.cr.on,.csug2>.cr:hover{background:var(--card2)}
.csug2 .ci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent);color:var(--c,var(--acc))}
.csug2 .ci img{width:20px;height:20px;border-radius:5px}
.csug2 b{font-weight:700;white-space:nowrap}
.csug2 span.h{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.csug2 kbd{font:inherit;font-size:10.5px;font-weight:800;color:var(--dim);padding:2px 7px;border-radius:7px;background:var(--bg2);opacity:0}
.csug2>.cr.on kbd{opacity:1}
.csug2 p.cds{font-size:12.5px;color:var(--mut);padding:8px 10px;margin:0}
/* ---- peek v2: what comes after the next thing */
.pk-then{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.pk-then .r{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
.pk-then .r .tm2{width:58px;flex:none;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.pk-then .r .dot{width:6px;height:6px}
.pk-then .r .ell{color:#c9ccd8;min-width:0;flex:1}
.pk-then .r.late .ell,.pk-then .r.late .tm2{color:var(--bad)}
.toast .tbody{line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;flex-shrink:0}
.pk-desc{font-size:13px;color:#c9ccd8;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.wod .k{font-size:10px;font-weight:800;letter-spacing:.08em;color:#fbbf24;flex:none}
.wod b{font-size:14px;font-weight:750;flex:none}
.wod .mut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:14px;background:var(--card,#14161c)}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;font-size:13px}
.lrow:hover{background:rgba(255,255,255,.04)}
.lrow.done .ell{opacity:.45;text-decoration:line-through}
.lrow .ck{width:18px;height:18px;border-radius:6px;border:1.6px solid rgba(255,255,255,.25);flex:none;cursor:pointer;display:grid;place-items:center}
.lrow .ck.on{background:var(--ok);border-color:var(--ok)}
.lrow .ck.on:after{content:"✓";color:#0a0b0f;font-size:11px;font-weight:900}
.lrow .dd{font-size:11px;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.lrow .dd.hot{color:#f59e0b;font-weight:700}
.lrow .lx{opacity:0;cursor:pointer;color:var(--mut);font-size:11px;padding:2px 6px;border-radius:6px}
.lrow:hover .lx{opacity:1}
.lk{cursor:pointer;color:var(--fg);font-weight:700}
.lk.add{color:var(--acc);padding:2px 6px;margin:-2px -6px -2px 0;border-radius:6px;transition:background .15s}
.lk.add:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.lk:hover{text-decoration:underline}
.hbs{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 4px}
